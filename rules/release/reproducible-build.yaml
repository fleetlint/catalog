id: release/reproducible-build
title: Release builds are reproducible
kind: capability
# Checked per published artifact: what makes a build reproducible differs between binaries, an
# image and a Maven archive, and some kinds are source packages with nothing to reproduce.
by: artifact
severity: info
scope: root
tiers: [1]
when: release.exists || repo.artifacts.size() > 0
message: "the release build is not set up to be reproducible"
requirement: "The release build removes what differs between two builds of the same commit: local paths and timestamps. The stack's build settings do it for the artifact, or `SOURCE_DATE_EPOCH` is set for the release build (in the workflow that publishes the artifact or in the task runner). Each artifact kind's implementation says what counts for it."
rationale: When anyone can rebuild a release bit for bit from the tag, a tampered artifact or a compromised build machine shows up as a mismatch.
fix:
  human: "Set the stack's reproducibility options in the release build (see https://reproducible-builds.org/docs/) and export SOURCE_DATE_EPOCH from the commit time."
  agent: "Add the stack's reproducibility settings to the release build and derive SOURCE_DATE_EPOCH from `git log -1 --format=%ct`; do not change what is built."
refs:
  - {url: "https://reproducible-builds.org/docs/", kind: standard, section: "Achieve deterministic builds"}
  - {url: "https://reproducible-builds.org/docs/source-date-epoch/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
