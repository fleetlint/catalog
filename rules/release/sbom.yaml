id: release/sbom
title: Releases publish an SBOM
kind: capability
by: artifact
severity: warning
tiers: [1]
scope: root
when: release.exists || repo.artifacts.size() > 0
message: "no release step generates an SBOM"
requirement: >
  Every artifact a release publishes that carries its own dependencies (files on a forge release, a
  container image, a Maven artifact, a NuGet package, an Android app) comes with an SPDX or CycloneDX
  SBOM generated inside the release pipeline and published next to it. A package the registry
  resolves from a manifest (npm, PyPI, crates.io, RubyGems, pub.dev) is not checked: the registry
  holds its dependency graph. Each artifact kind's implementation names its producers; repositories
  add producers with `accept:`.
rationale: >
  Consumers and scanners need to know what is inside an artifact; generating the SBOM
  in the pipeline ties it to the exact build.
fix:
  human: "Run the artifact's SBOM producer in the release workflow (`fleetlint explain release/sbom/<artifact>`): syft or GoReleaser `sboms:` for release files, BuildKit `sbom: true` or `cosign attest --type spdx` for an image, the CycloneDX build plugin for Maven, NuGet and Android; upload the files with the release."
  agent: "In the tag-triggered release workflow add a step producing an SPDX JSON SBOM for each published artifact (syft for files, BuildKit `sbom: true` for images, the stack's CycloneDX plugin otherwise) and include the files in the release upload step. Do not change other steps. If the repo uses GoReleaser, add a `sboms:` section instead."
refs:
  - {url: "https://csrc.nist.gov/pubs/sp/800/218/final", kind: standard, section: "PS.3.2: Collect, safeguard, maintain, and share provenance data for all components of each software release"}
  - {url: "https://github.com/ossf/scorecard/blob/main/docs/checks.md", kind: standard, section: "SBOM"}
  - {url: "https://spdx.github.io/spdx-spec/v2.3/", kind: spec}
  - {url: "https://cyclonedx.org/specification/overview/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
