id: release/provenance/gem
kind: outcome
satisfiers:
  - name: release-gem
    expr: >
      artifact_workflows("gem").exists(w, text(w).matches("id-token:\\s*write") && steps(w).exists(s,
        s.uses.startsWith("rubygems/release-gem") && !("attestations" in s.with && (s.with.attestations == false || s.with.attestations == "false"))))
requirement: "Gems are pushed by rubygems/release-gem with trusted publishing, which attaches Sigstore attestations."
fix:
  human: "Release with rubygems/release-gem from a job with `id-token: write`."
refs: ["https://fleetlint.org/rules/capabilities/#artifacts", "https://guides.rubygems.org/trusted-publishing/"]
