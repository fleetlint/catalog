id: release/provenance/release-files
kind: outcome
satisfiers:
  - name: attest-action
    expr: artifact_workflows("release-files").exists(w, steps(w).exists(s, s.uses.startsWith("actions/attest-build-provenance") || s.uses.startsWith("actions/attest@")))
  - name: slsa-generator
    expr: artifact_workflows("release-files").exists(w, steps(w).exists(s, s.uses.startsWith("slsa-framework/")) || jobs(w).exists(j, j.uses.startsWith("slsa-framework/")))
  - name: cosign-attest-blob
    expr: artifact_workflows("release-files").exists(w, steps(w).exists(s, s.run.matches("\\bcosign attest-blob\\b")))
  - name: gitlab-artifact-metadata
    expr: >
      artifact_workflows("release-files").exists(w, ci_kind(w) == "gitlab"
        && text(w).matches("RUNNER_GENERATE_ARTIFACTS_METADATA:\\s*[\"']?true"))
requirement: >
  The workflow that publishes the release files attests its provenance: actions/attest-build-provenance (the
  subject path covering the files), the SLSA generator, `cosign attest-blob`, or GitLab's artifact
  provenance (`RUNNER_GENERATE_ARTIFACTS_METADATA: "true"`).
fix:
  human: "Add actions/attest-build-provenance with `subject-path` covering the release files (GitHub), `RUNNER_GENERATE_ARTIFACTS_METADATA: \"true\"` (GitLab) or `cosign attest-blob --predicate` (Gitea) to the release workflow."
refs:
  - {url: "https://slsa.dev/spec/v1.0/provenance", kind: standard}
  - {url: "https://slsa.dev/spec/v1.0/levels", kind: standard, section: "Build L1: Provenance exists"}
  - {url: "https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds", kind: guidance, section: "Generating build provenance for binaries"}
  - {url: "https://github.com/slsa-framework/slsa-github-generator", kind: spec}
  - {url: "https://docs.gitlab.com/ci/runners/configure_runners/", kind: spec, section: "Artifact provenance metadata"}
  - "https://fleetlint.org/baseline/#releases"
