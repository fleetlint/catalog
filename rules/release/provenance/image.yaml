id: release/provenance/image
kind: outcome
locate: 'artifact.workflows.size() > 0 ? artifact.workflows[0] : ".github/workflows/release.yml"'
satisfiers:
  - name: buildkit
    expr: >
      artifact.workflows.exists(w, steps(w).exists(s,
        (s.uses.startsWith("docker/build-push-action") && !s.uses.matches("@v[1-3](\\.|$)")
          && !("provenance" in s.with && (s.with.provenance == false || s.with.provenance == "false")))
        || s.run.matches("\\bdocker buildx build\\b[^\\n]*--provenance")))
  - name: cosign-attest
    expr: artifact.workflows.exists(w, steps(w).exists(s, s.run.matches("\\bcosign attest\\b[^\\n]*--type\\s*slsaprovenance")))
  - name: attest-action
    expr: artifact.workflows.exists(w, steps(w).exists(s, s.uses.startsWith("actions/attest-build-provenance") && "subject-digest" in s.with))
  - name: goreleaser-buildx
    expr: >
      [".goreleaser.yaml", ".goreleaser.yml"].exists(f, file(f) && type(yaml(f)) == map && "dockers_v2" in yaml(f)
        && !yaml(f).dockers_v2.exists(d, "provenance" in d && (d.provenance == false || d.provenance == "false")))
  - name: slsa-container-generator
    expr: artifact.workflows.exists(w, jobs(w).exists(j, j.uses.startsWith("slsa-framework/slsa-github-generator/.github/workflows/generator_container")))
requirement: >
  Provenance is attached to the image digest: BuildKit (docker/build-push-action v4 or newer with
  `provenance` not set to false, `docker buildx build --provenance`), `cosign attest --type
  slsaprovenance`, actions/attest-build-provenance with `subject-digest` and `push-to-registry`, or
  the SLSA container generator.
fix:
  human: "Keep docker/build-push-action v4 or newer and do not set `provenance: false`; or run `cosign attest --yes --type slsaprovenance --predicate provenance.json <image>@<digest>`."
  agent: "Remove `provenance: false` from the docker/build-push-action step, or add actions/attest-build-provenance with `subject-name`, `subject-digest` from the build step and `push-to-registry: true`."
refs:
  - {url: "https://slsa.dev/spec/v1.0/provenance", kind: standard}
  - {url: "https://docs.docker.com/build/metadata/attestations/slsa-provenance/", kind: spec}
  - {url: "https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds", kind: guidance, section: "Generating build provenance for container images"}
  - {url: "https://docs.sigstore.dev/cosign/verifying/attestation/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
