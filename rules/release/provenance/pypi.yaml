id: release/provenance/pypi
kind: outcome
satisfiers:
  - name: pypi-attestations
    expr: >
      artifact_workflows("pypi").exists(w, text(w).matches("id-token:\\s*write") && steps(w).exists(s,
        s.uses.startsWith("pypa/gh-action-pypi-publish") && !("attestations" in s.with && (s.with.attestations == false || s.with.attestations == "false"))))
requirement: "Distributions are uploaded by pypa/gh-action-pypi-publish with trusted publishing, which attaches PEP 740 attestations unless `attestations: false`."
fix:
  human: "Publish with pypa/gh-action-pypi-publish from a job with `id-token: write` (trusted publishing)."
refs: ["https://fleetlint.org/rules/capabilities/#artifacts", "https://docs.pypi.org/attestations/"]
