id: release/semver-tags
title: Tags are semantic versions
kind: expr
severity: warning
scope: root
when: repo.has_git && tags().size() > 0
foreach: tags()
expr: item.matches("^(([A-Za-z0-9_.-]+/)*v?|(@[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+@v?|[A-Za-z0-9_.]+(-[A-Za-z0-9_.]+)*-v?)[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")
message: "tag is not a semantic version"
requirement: "Every tag is `vMAJOR.MINOR.PATCH[-prerelease][+build]` (the `v` optional). Monorepos prefix a component: `path/to/module/v1.2.3`, `pkg@1.2.3` or `@scope/pkg@1.2.3` (changesets) and `pkg-v1.2.3` (release-please)."
rationale: Release tooling, changelog generation and dependency resolvers all key on the pattern.
fix:
  human: "Delete or rename the offending tags; tag releases as vX.Y.Z from now on."
  agent: "List the offending tags for the user; do not delete tags without confirmation."
refs:
  - {url: "https://semver.org/spec/v2.0.0.html", kind: standard}
  - {url: "https://go.dev/ref/mod", kind: spec, section: "Mapping versions to commits"}
  - "https://fleetlint.org/baseline/#releases"
