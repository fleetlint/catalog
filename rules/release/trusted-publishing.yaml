id: release/trusted-publishing
title: Packages are published with trusted publishing
kind: expr
severity: warning
tiers: [1]
scope: root
when: >
  tagged_workflows().exists(w, ci_kind(w) in ["github", "gitlab"] && steps(w).exists(s,
    s.uses.matches("^(pypa/gh-action-pypi-publish|rubygems/release-gem|JS-DevTools/npm-publish|katyo/publish-crates)@")
    || s.run.matches("\\b(npm publish|pnpm publish|yarn npm publish|bun publish|twine upload|uv publish|poetry publish|flit publish|hatch publish|pdm publish|cargo publish|gem push)\\b")))
foreach: >
  tagged_workflows().filter(w, ci_kind(w) in ["github", "gitlab"] && steps(w).exists(s,
    s.uses.matches("^(pypa/gh-action-pypi-publish|rubygems/release-gem|JS-DevTools/npm-publish|katyo/publish-crates)@")
    || s.run.matches("\\b(npm publish|pnpm publish|yarn npm publish|bun publish|twine upload|uv publish|poetry publish|flit publish|hatch publish|pdm publish|cargo publish|gem push)\\b")))
expr: >
  ci_kind(item) == "gitlab"
    ? text(item).matches("(?m)^\\s*id_tokens:")
    : text(item).matches("id-token:\\s*write")
      && !steps(item).exists(s, s.uses.startsWith("pypa/gh-action-pypi-publish") && "password" in s.with)
      && !grep(item, r'^\s*-?\s*(?:NODE_AUTH_TOKEN|NPM_TOKEN|TWINE_PASSWORD|TWINE_API_KEY|UV_PUBLISH_TOKEN|UV_PUBLISH_PASSWORD|POETRY_PYPI_TOKEN_\w+|POETRY_HTTP_BASIC_PYPI_PASSWORD|FLIT_PASSWORD|HATCH_INDEX_AUTH|PDM_PUBLISH_PASSWORD|CARGO_REGISTRY_TOKEN|GEM_HOST_API_KEY)\s*:\s*["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
      && !grep(item, r'--token[\s=]+["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
message: "the release publishes with a long-lived registry token instead of trusted publishing (OIDC)"
requirement: >
  A tag-triggered workflow that publishes to npm, PyPI, crates.io or RubyGems authenticates with the
  registry's trusted publishing (OIDC): on GitHub the job has `id-token: write` and no registry token
  from secrets is passed (NPM_TOKEN/NODE_AUTH_TOKEN, a pypi-publish `password`, TWINE_PASSWORD,
  UV_PUBLISH_TOKEN, CARGO_REGISTRY_TOKEN, GEM_HOST_API_KEY, `--token`); on GitLab the pipeline declares
  `id_tokens:`. Gitea and Forgejo workflows are not checked: the registries do not trust their tokens.
rationale: A registry token in CI secrets is valid for months and publishes from anywhere once leaked; an OIDC token is minted per run, scoped to this repository and workflow, and expires in minutes.
fix:
  human: "Register the repository and workflow as a trusted publisher on the registry, grant `id-token: write` to the release job and delete the token secret."
  agent: "Grant `id-token: write` on the publishing job, remove the registry token from env/with (pypa/gh-action-pypi-publish without password, `npm publish` with npm 11.5.1 or newer, rust-lang/crates-io-auth-action for cargo, rubygems/release-gem for gems; on GitLab add `id_tokens:` with the registry's audience), and tell the user to register the trusted publisher and delete the secret."
refs: ["https://fleetlint.org/baseline/#releases", "https://fleetlint.org/baseline/#security"]
