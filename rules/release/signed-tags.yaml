id: release/signed-tags
title: Release tags are signed
kind: expr
severity: warning
scope: root
tiers: [1]
when: repo.has_git && tags().exists(t, t.matches("^(([A-Za-z0-9_.-]+/)*v?|(@[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+@v?|[A-Za-z0-9_.]+(-[A-Za-z0-9_.]+)*-v?)[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"))
params:
  recent: 3
foreach: >
  tags().filter(t, t.matches("^(([A-Za-z0-9_.-]+/)*v?|(@[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+@v?|[A-Za-z0-9_.]+(-[A-Za-z0-9_.]+)*-v?)[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")).slice(0,
    tags().filter(t, t.matches("^(([A-Za-z0-9_.-]+/)*v?|(@[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+@v?|[A-Za-z0-9_.]+(-[A-Za-z0-9_.]+)*-v?)[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")).size() < int(params.recent)
      ? tags().filter(t, t.matches("^(([A-Za-z0-9_.-]+/)*v?|(@[A-Za-z0-9_.-]+/)?[A-Za-z0-9_.-]+@v?|[A-Za-z0-9_.]+(-[A-Za-z0-9_.]+)*-v?)[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")).size() : int(params.recent))
expr: tag_signed(item)
message: "release tag is not signed"
requirement: "The newest `params.recent` version tags (semantic versions, with the component prefixes release/semver-tags accepts) are annotated tags with a PGP, SSH or X.509 signature (`git tag -s`). Tags created through a forge's release page are lightweight and fail; create the tag locally and push it, then publish the release from it."
rationale: A signed tag ties the released commit to a maintainer's key; the release pipeline then builds from something that can be verified, not just from a name.
fix:
  human: "Set `git config tag.gpgsign true` (and `gpg.format ssh` with your SSH key) so every tag is signed; recreate unsigned release tags only if nothing depends on them."
  agent: "Tell the user which tags are unsigned and how to configure tag.gpgsign; do not delete or move tags."
refs:
  - {url: "https://git-scm.com/docs/git-tag", kind: spec}
  - {url: "https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-tags", kind: guidance}
  - "https://fleetlint.org/baseline/#releases"
