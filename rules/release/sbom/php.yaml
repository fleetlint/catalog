id: release/sbom/php
kind: outcome
satisfiers:
  - name: cyclonedx-composer
    expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("CycloneDX:make-sbom\\b")))
partials:
  - name: sbom-outside-release
    severity: info
    expr: >
      (taskrunner.kind == "make" && "sbom" in makefile("Makefile").targets)
      || workflows().exists(w, steps(w).exists(s, s.run.matches("\\bsyft\\b") || s.uses.startsWith("anchore/sbom-action")))
    message: "an SBOM producer exists but no tag-triggered release workflow invokes it"
requirement: "The release runs the CycloneDX Composer plugin (`composer CycloneDX:make-sbom`); or a stack-neutral producer."
fix:
  human: "Require cyclonedx/cyclonedx-php-composer as a dev dependency and run `composer CycloneDX:make-sbom` in the release workflow."
refs: ["https://fleetlint.org/stacks/#php"]
