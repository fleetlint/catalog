id: release/sbom/rust
kind: outcome
satisfiers:
  - name: cargo-sbom
    expr: >
      tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bcargo (sbom|cyclonedx)\\b")))
      || (file("Cargo.toml") && text("Cargo.toml").contains("cyclonedx"))
partials:
  - name: sbom-outside-release
    severity: info
    expr: >
      (taskrunner.kind == "make" && "sbom" in makefile("Makefile").targets)
      || workflows().exists(w, steps(w).exists(s, s.run.matches("\\bsyft\\b") || s.uses.startsWith("anchore/sbom-action")))
    message: "an SBOM producer exists but no tag-triggered release workflow invokes it"
requirement: "The release runs cargo-cyclonedx or cargo-sbom; or a stack-neutral producer."
fix:
  human: "Run `cargo cyclonedx --format json` in the release workflow and upload the BOM."
refs: ["https://fleetlint.org/stacks/#rust"]
