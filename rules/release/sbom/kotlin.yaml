id: release/sbom/kotlin
kind: outcome
satisfiers:
  # The CycloneDX build plugins resolve the real dependency graph of the published artifact.
  - name: cyclonedx-gradle
    expr: >
      tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bcyclonedx(Direct)?Bom\\b")))
  - name: cyclonedx-maven
    expr: >
      glob("**/pom.xml").exists(f, text(f).contains("cyclonedx-maven-plugin") && text(f).matches("<goal>make(Aggregate)?Bom</goal>"))
      || tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("cyclonedx(-maven)?:make(Aggregate)?Bom\\b")))
partials:
  - name: sbom-outside-release
    severity: info
    expr: >
      (taskrunner.kind == "make" && "sbom" in makefile("Makefile").targets)
      || workflows().exists(w, steps(w).exists(s, s.run.matches("\\bsyft\\b") || s.uses.startsWith("anchore/sbom-action")))
    message: "an SBOM producer exists but no tag-triggered release workflow invokes it"
requirement: >
  The release runs the CycloneDX Gradle plugin's `cyclonedxBom` task or the cyclonedx-maven-plugin
  (`makeBom`/`makeAggregateBom`), which read the build's resolved dependencies; or a stack-neutral
  producer such as syft over the lockfile.
fix:
  human: "Apply the CycloneDX Gradle plugin (`org.cyclonedx.bom`) and run `./gradlew cyclonedxBom` in the release workflow (or bind cyclonedx-maven-plugin's makeAggregateBom); upload the BOM with the release."
refs: ["https://fleetlint.org/stacks/#kotlin-jvm--android", "https://github.com/CycloneDX/cyclonedx-gradle-plugin"]
