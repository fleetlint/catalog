id: release/reproducible-build/release-files
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
satisfiers:
  - name: goreleaser
    expr: >
      [".goreleaser.yaml", ".goreleaser.yml"].exists(f, file(f) && text(f).contains("-trimpath") && text(f).matches(r'mod_timestamp:\s*\S'))
  - name: go-build
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bgo build\b[^;&|]*-trimpath') && !l.matches(params.skip)))
      || artifact.workflows.exists(w, steps(w).exists(s, s.run.matches(r'\bgo build\b[^;&|\n]*-trimpath')))
  - name: cargo-locked-remapped
    expr: >
      (taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bcargo\s+(build|zigbuild|auditable\s+build)\b[^;&|]*--release') && l.matches(r'--(locked|frozen)\b') && !l.matches(params.skip)))
        || artifact.workflows.exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\bcargo\s+(build|zigbuild|auditable\s+build)\b[^;&|]*--release') && l.matches(r'--(locked|frozen)\b')))))
      && (scan("Cargo.toml", r'--remap-path-prefix').size() > 0 || (file(".cargo/config.toml") && text(".cargo/config.toml").contains("--remap-path-prefix"))
        || taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.contains("--remap-path-prefix")))
        || artifact.workflows.exists(w, text(w).contains("--remap-path-prefix")))
  - name: dotnet-ci-build
    expr: >
      (glob("**/*.csproj") + glob("**/*.fsproj") + glob("**/Directory.Build.props")).exists(f, text(f).matches(r'<ContinuousIntegrationBuild[^>]*>\s*true'))
      || artifact.workflows.exists(w, text(w).matches(r'[-/]p:ContinuousIntegrationBuild=true'))
  - name: source-date-epoch
    expr: >
      artifact.workflows.exists(w, text(w).contains("SOURCE_DATE_EPOCH"))
      || taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.contains("SOURCE_DATE_EPOCH") && !l.matches(params.skip)))
      || (taskrunner.kind == "make" && scan(taskrunner.file, r'^\s*(export\s+)?SOURCE_DATE_EPOCH\s*[:?]?=').size() > 0)
requirement: "The binaries and archives are built without local paths or build-time stamps: Go with `-trimpath` (in .goreleaser.yaml together with `mod_timestamp`, or in the `go build` of the task runner or the publishing workflow); Rust with `cargo build --release --locked` and `--remap-path-prefix`; .NET with `ContinuousIntegrationBuild`; or `SOURCE_DATE_EPOCH` is set for the release build, in the workflow that publishes the files or the task runner."
fix:
  human: "Go: add `flags: [-trimpath]` and `mod_timestamp: \"{{ .CommitTimestamp }}\"` to the goreleaser builds. Rust: build with `--locked` and `RUSTFLAGS=\"--remap-path-prefix=$PWD=.\"`. .NET: set `ContinuousIntegrationBuild` in Directory.Build.props. Else export SOURCE_DATE_EPOCH from the commit time."
refs:
  - {url: "https://goreleaser.com/customization/builds/go/", kind: spec, section: "Reproducible Builds"}
  - {url: "https://pkg.go.dev/cmd/go", kind: spec}
  - {url: "https://doc.rust-lang.org/rustc/command-line-arguments.html", kind: spec, section: "--remap-path-prefix: remap source paths in output"}
  - {url: "https://learn.microsoft.com/en-us/dotnet/core/project-sdk/msbuild-props", kind: spec, section: "ContinuousIntegrationBuild"}
  - {url: "https://reproducible-builds.org/docs/source-date-epoch/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
