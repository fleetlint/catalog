id: release/reproducible-build/java
kind: outcome
satisfiers:
  - name: maven-output-timestamp
    expr: file("pom.xml") && text("pom.xml").matches(r'<project\.build\.outputTimestamp>\s*[^<\s]')
  - name: gradle-archives
    expr: >
      glob("**/build.gradle*").exists(f, text(f).matches(r'preserveFileTimestamps\s*=\s*false') && text(f).matches(r'reproducibleFileOrder\s*=\s*true'))
      || (file("gradle/wrapper/gradle-wrapper.properties") && text("gradle/wrapper/gradle-wrapper.properties").matches(r'gradle-([9]|[1-9]\d)\.'))
requirement: "Archives are reproducible: Maven sets `project.build.outputTimestamp`; Gradle sets `preserveFileTimestamps = false` and `reproducibleFileOrder = true` on its archive tasks, or the wrapper is Gradle 9 or later, where that is the default; or SOURCE_DATE_EPOCH is set for the release build."
fix:
  human: "Maven: set `<project.build.outputTimestamp>` (the release plugin updates it); Gradle: configure `tasks.withType<AbstractArchiveTask>` or update to Gradle 9."
refs: ["https://fleetlint.org/stacks/#java"]
