id: release/trusted-publishing/gem
kind: expr
when: >
  artifact_workflows("gem").filter(w, ci_kind(w) in ["github", "gitlab"]).size() > 0
foreach: >
  artifact_workflows("gem").filter(w, ci_kind(w) in ["github", "gitlab"])
expr: >
  ci_kind(item) == "gitlab"
    ? text(item).matches("(?m)^\\s*id_tokens:")
    : text(item).matches("id-token:\\s*write")
      && !grep(item, r'^\s*-?\s*(?:GEM_HOST_API_KEY)\s*:\s*["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
      && !grep(item, r'--(?:token|api-key)[\s=]+["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
requirement: "A GitHub or GitLab workflow that publishes to RubyGems (`gem push`, rubygems/release-gem) uses trusted publishing: `id-token: write` and no GEM_HOST_API_KEY or `--token` from secrets; on GitLab `id_tokens:`."
fix:
  human: "Register the workflow as a trusted publisher on rubygems.org, release with rubygems/release-gem from a job with `id-token: write`, and delete the API key secret."
refs: ["https://fleetlint.org/baseline/#releases", "https://guides.rubygems.org/trusted-publishing/"]
