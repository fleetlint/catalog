id: release/trusted-publishing/npm
kind: expr
when: >
  artifact_workflows("npm").filter(w, ci_kind(w) in ["github", "gitlab"]).size() > 0
foreach: >
  artifact_workflows("npm").filter(w, ci_kind(w) in ["github", "gitlab"])
expr: >
  ci_kind(item) == "gitlab"
    ? text(item).matches("(?m)^\\s*id_tokens:")
    : text(item).matches("id-token:\\s*write")
      && !grep(item, r'^\s*-?\s*(?:NODE_AUTH_TOKEN|NPM_TOKEN)\s*:\s*["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
      && !grep(item, r'--(?:token|api-key)[\s=]+["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
requirement: "A GitHub or GitLab workflow that publishes to npm uses trusted publishing: `id-token: write` (npm 11.5.1 or newer) and no NPM_TOKEN/NODE_AUTH_TOKEN or `--token` from secrets; on GitLab `id_tokens:`."
fix:
  human: "Register the workflow as a trusted publisher on npmjs.com, publish with npm 11.5.1+ from a job with `id-token: write`, and delete the NPM_TOKEN secret."
refs:
  - {url: "https://docs.npmjs.com/trusted-publishers", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
