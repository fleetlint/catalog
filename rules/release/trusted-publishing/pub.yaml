id: release/trusted-publishing/pub
kind: expr
when: >
  artifact_workflows("pub").filter(w, ci_kind(w) in ["github", "gitlab"]).size() > 0
foreach: >
  artifact_workflows("pub").filter(w, ci_kind(w) in ["github", "gitlab"])
expr: >
  ci_kind(item) == "gitlab"
    ? text(item).matches("(?m)^\\s*id_tokens:")
    : text(item).matches("id-token:\\s*write")
      && !grep(item, r'^\s*-?\s*(?:PUB_CREDENTIALS|PUB_TOKEN)\s*:\s*["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
      && !grep(item, r'--(?:token|api-key)[\s=]+["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
requirement: "A GitHub or GitLab workflow that publishes to pub.dev uses automated publishing with OIDC: `id-token: write` and no PUB_CREDENTIALS or PUB_TOKEN from secrets; on GitLab `id_tokens:`."
fix:
  human: "Enable automated publishing from GitHub Actions on pub.dev for the package, publish from a job with `id-token: write` (dart-lang/setup-dart exchanges the token), and delete the credentials secret."
refs: ["https://fleetlint.org/baseline/#releases", "https://dart.dev/tools/pub/automated-publishing"]
