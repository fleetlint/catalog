id: release/trusted-publishing/node
kind: expr
when: >
  tagged_workflows().filter(w, ci_kind(w) in ["github", "gitlab"] && steps(w).exists(s,
    s.uses.startsWith("JS-DevTools/npm-publish")
    || s.run.matches("\\b(npm publish|pnpm publish|yarn npm publish|bun publish)\\b"))).size() > 0
foreach: >
  tagged_workflows().filter(w, ci_kind(w) in ["github", "gitlab"] && steps(w).exists(s,
    s.uses.startsWith("JS-DevTools/npm-publish")
    || s.run.matches("\\b(npm publish|pnpm publish|yarn npm publish|bun publish)\\b")))
expr: >
  ci_kind(item) == "gitlab"
    ? text(item).matches("(?m)^\\s*id_tokens:")
    : text(item).matches("id-token:\\s*write")
      && !grep(item, r'^\s*-?\s*(?:NODE_AUTH_TOKEN|NPM_TOKEN)\s*:\s*["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
      && !grep(item, r'--token[\s=]+["\x27]?\$\{\{\s*secrets\.(\w+)').exists(m, m.match.upperAscii() != "GITHUB_TOKEN")
requirement: "A tag-triggered GitHub or GitLab workflow that publishes to npm (`npm|pnpm|yarn npm|bun publish`, JS-DevTools/npm-publish) uses trusted publishing: `id-token: write` (npm 11.5.1 or newer) and no NPM_TOKEN/NODE_AUTH_TOKEN or `--token` from secrets; on GitLab `id_tokens:`."
fix:
  human: "Register the workflow as a trusted publisher on npmjs.com, publish with npm 11.5.1+ from a job with `id-token: write`, and delete the NPM_TOKEN secret."
refs: ["https://fleetlint.org/stacks/#nodejs--typescript"]
