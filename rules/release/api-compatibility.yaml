id: release/api-compatibility
title: A library checks its API against the previous release
kind: capability
severity: info
scope: root
tiers: [1]
message: "no API compatibility check against the previous release"
requirement: "A stack that publishes a library runs its API check against the previous release, in the task runner or a workflow. Each implementation says when the stack's project is a library. Another tool is added with `accept:`."
rationale: A breaking change in a minor release is found by every user at once; the check finds it before the tag.
fix:
  human: "Add the stack's API compatibility check to the release target or workflow, comparing against the previous tag (see https://fleetlint.org/stacks/)."
  agent: "Add the stack's API compatibility tool to the release workflow, comparing against the latest tag; on a breaking change bump the major version instead of silencing the tool."
refs:
  - {url: "https://semver.org/spec/v2.0.0.html", kind: standard}
  - {url: "https://fleetlint.org/baseline/#releases", kind: convention}
