id: release/api-compatibility/java
kind: outcome
locate: '(["pom.xml", "build.gradle.kts", "build.gradle"].filter(f, file(f)) + ["pom.xml"])[0]'
when: >
  grep("**/build.gradle*", "maven-publish").size() > 0 || grep("**/pom.xml", "<distributionManagement>").size() > 0
satisfiers:
  - name: task-runner-or-ci
    expr: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", "package.json", "build.gradle", "build.gradle.kts", ".pre-commit-config.yaml", "pyproject.toml"].exists(f, text(f).matches("\\b(japicmp|revapi)\\b"))
      || workflows().exists(w, text(w).matches("\\b(japicmp|revapi)\\b"))
requirement: "A library published with maven-publish or Maven deploy runs japicmp or revapi against the previous release."
fix:
  human: "Add japicmp-maven-plugin (or me.champeau.gradle.japicmp) comparing against the previous release version."
refs:
  - {url: "https://siom79.github.io/japicmp/", kind: spec}
  - "https://fleetlint.org/stacks/#java"
