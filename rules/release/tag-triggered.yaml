id: release/tag-triggered
title: Releases run from a tag-triggered workflow
kind: expr
severity: error
tiers: [1]
scope: root
when: release.mechanisms.exists(m, m != "git-cliff")
expr: tagged_workflows().size() > 0
message: "a release mechanism exists but no workflow is triggered by tag pushes"
requirement: "Releases are produced by CI from a version tag, never from a laptop: an Actions workflow on `push: tags:` or a GitLab job whose `rules:` match `$CI_COMMIT_TAG` (or `only: tags`)."
rationale: A release built locally has no provenance and cannot be reproduced.
fix:
  human: "Add release.yml triggered on push.tags ['v*'] that runs the release tool; `fleetlint fix --apply` writes the stack's template (GoReleaser for Go and Rust, `make dist` plus syft and cosign otherwise) as a starting point."
  agent: "Add .github/workflows/release.yml (or .gitea/workflows/; on GitLab a release job with `rules: [{if: $CI_COMMIT_TAG}]`) with `on: push: tags: ['v*']` running the existing release tool; keep permissions minimal. Adapt the template to the release tool already in the repository instead of replacing it."
  actions:
    - template: "{stack}/release.yml"
      to: .github/workflows/release.yml
refs:
  - {url: "https://slsa.dev/spec/v1.0/requirements", kind: standard, section: "Follow a consistent build process"}
  - {url: "https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions", kind: spec, section: "on.push.tags"}
  - {url: "https://docs.gitlab.com/ci/yaml/", kind: spec, section: "rules:if"}
  - "https://fleetlint.org/baseline/#releases"
