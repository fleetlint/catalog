id: release/signing/kotlin
kind: outcome
satisfiers:
  # The APK or AAB carries its own signature (APK Signature Scheme v2+, JAR signing for an AAB),
  # which Android checks on install and on every update. The release verifies or applies it.
  - name: android-apk-signing
    expr: >
      tagged_workflows().exists(w, steps(w).exists(s,
        s.run.matches("\\bapksigner\\b[^\\n]*\\b(sign|verify)\\b|\\bjarsigner\\b")
        || s.uses.matches("^(r0adkll|ilharp)/sign-android-release")))
  # Libraries for Maven Central: PGP from Gradle's signing plugin (or the vanniktech publish plugin)
  # on a publishing release, or from Maven's gpg/sign plugin.
  - name: maven-central-pgp
    expr: >
      ((glob("**/*.gradle*") + glob("buildSrc/**/*.kt") + glob("build-logic/**/*.kt"))
        .exists(f, text(f).matches("(?m)^\\s*signing\\s*$|\\bsigning\\s*\\{|id\\(\\s*[\"']signing[\"']\\s*\\)|`signing`|\\bsignAllPublications\\(\\)|plugin\\s*[:=]\\s*[\"']signing[\"']"))
      && tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bpublish[A-Za-z]*\\b"))))
      || glob("**/pom.xml").exists(f, text(f).matches("<artifactId>(maven-gpg-plugin|sign-maven-plugin)</artifactId>"))
partials:
  - name: cosign-outside-release
    severity: warning
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
    message: "cosign is installed in a workflow but no tag-triggered release signs its artifacts"
requirement: >
  An Android app's APK or AAB is signed with the release key and the release workflow verifies it
  (`apksigner verify` for an APK, `jarsigner -verify` for an AAB) or signs it (apksigner, jarsigner, a
  sign-android-release action). A library published to Maven Central is signed with PGP (Gradle's
  `signing` plugin or `signAllPublications()` with a publishing release, Maven's gpg or sign plugin).
  Or a stack-neutral signature: cosign, GoReleaser, gpg.
fix:
  human: "Android app: sign with the release key (a release signingConfig fed from CI secrets) and add `apksigner verify --print-certs <apk>` (or `jarsigner -verify <aab>`) to the release workflow; that is the signature Android checks, no cosign needed. Library: apply Gradle's `signing` plugin to the Maven publication."
  agent: "Android app: keep the release key's signature and add `apksigner verify --print-certs` (APK) or `jarsigner -verify` (AAB) on the built artifact to the release workflow. Library: apply the signing plugin to the Maven publication with the key from CI secrets. Do not add cosign for these."
refs: ["https://fleetlint.org/stacks/#kotlin-jvm--android", "https://developer.android.com/studio/publish/app-signing"]
