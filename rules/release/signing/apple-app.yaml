id: release/signing/apple-app
kind: outcome
locate: 'artifact.workflows.size() > 0 ? artifact.workflows[0] : ".github/workflows/release.yml"'
satisfiers:
  - name: codesign-on-export
    expr: >
      artifact.workflows.exists(w, steps(w).exists(s,
        s.run.matches("\\bxcodebuild\\b[^\\n]*-exportArchive|\\bcodesign\\b[^\\n]*(--sign|-s\\b)|\\bfastlane\\b[^\\n]*\\b(gym|build_app|build_ios_app|match|sigh)\\b|\\bflutter build ipa\\b[^\\n]*--export-options-plist")))
  - name: notarized
    expr: artifact.workflows.exists(w, steps(w).exists(s, s.run.matches("\\bnotarytool submit\\b") && s.run.matches("\\bstapler staple\\b|--wait")))
requirement: >
  The build is code-signed with a Developer ID or distribution identity on export (xcodebuild
  -exportArchive with a signing identity, codesign, fastlane gym/match, `flutter build ipa
  --export-options-plist`); a macOS download is notarized and stapled (`notarytool submit`, `stapler`).
fix:
  human: "Export with a signing identity (`xcodebuild -exportArchive -exportOptionsPlist` with the distribution certificate from CI secrets, or fastlane match + gym); for a macOS download add `notarytool submit --wait` and `stapler staple`."
refs:
  - {url: "https://developer.apple.com/documentation/security/notarizing-macos-software-before-distribution", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
