id: release/signing/pypi
kind: outcome
locate: 'artifact.workflows.size() > 0 ? artifact.workflows[0] : ".github/workflows/release.yml"'
satisfiers:
  - name: pypi-attestations
    expr: >
      artifact.workflows.exists(w, text(w).matches("id-token:\\s*write") && steps(w).exists(s,
        s.uses.startsWith("pypa/gh-action-pypi-publish") && !("attestations" in s.with && (s.with.attestations == false || s.with.attestations == "false"))))
  - name: sigstore-python
    expr: artifact.workflows.exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/gh-action-sigstore-python")))
requirement: >
  Wheels and sdists carry PyPI attestations (pypa/gh-action-pypi-publish with trusted publishing,
  which attests by default) or are signed with sigstore-python.
fix:
  human: "Publish with pypa/gh-action-pypi-publish and trusted publishing (`id-token: write`); it uploads Sigstore attestations."
refs:
  - {url: "https://docs.pypi.org/attestations/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
