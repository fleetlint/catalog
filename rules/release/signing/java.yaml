id: release/signing/java
kind: outcome
satisfiers:
  # Maven Central requires PGP signatures: Maven's gpg/sign plugin, or Gradle's signing plugin
  # (or the vanniktech publish plugin) on a publishing release.
  - name: maven-central-pgp
    expr: >
      glob("**/pom.xml").exists(f, text(f).matches("<artifactId>(maven-gpg-plugin|sign-maven-plugin)</artifactId>"))
      || ((glob("**/*.gradle*") + glob("buildSrc/**/*.kt") + glob("buildSrc/**/*.java") + glob("build-logic/**/*.kt"))
        .exists(f, text(f).matches("(?m)^\\s*signing\\s*$|\\bsigning\\s*\\{|id\\(\\s*[\"']signing[\"']\\s*\\)|`signing`|\\bsignAllPublications\\(\\)|plugin\\s*[:=]\\s*[\"']signing[\"']"))
      && tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bpublish[A-Za-z]*\\b"))))
  - name: jarsigner
    expr: tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bjarsigner\\b")))
partials:
  - name: cosign-outside-release
    severity: warning
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
    message: "cosign is installed in a workflow but no tag-triggered release signs its artifacts"
requirement: >
  Artifacts for Maven Central are signed with PGP (Maven's gpg or sign plugin, Gradle's `signing`
  plugin with a publishing release), or JARs are signed with jarsigner in the release workflow; or a
  stack-neutral signature: cosign, GoReleaser, gpg.
fix:
  human: "Maven: add maven-gpg-plugin (or sign-maven-plugin) to the release profile; Gradle: apply the `signing` plugin to the Maven publication. The key comes from CI secrets."
refs: ["https://fleetlint.org/stacks/#java", "https://central.sonatype.org/publish/requirements/gpg/"]
