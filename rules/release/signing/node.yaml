id: release/signing/node
kind: outcome
satisfiers:
  - name: npm-provenance
    expr: >
      tagged_workflows().exists(w, steps(w).exists(s, s.run.matches("\\bnpm publish\\b")
        && (s.run.matches("npm publish[^\\n]*--provenance") || text(w).matches("NPM_CONFIG_PROVENANCE:\\s*[\"']?true|id-token:\\s*write"))))
partials:
  - name: cosign-outside-release
    severity: warning
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
    message: "cosign is installed in a workflow but no tag-triggered release signs its artifacts"
requirement: >
  Packages are published to npm with provenance (`npm publish --provenance`, NPM_CONFIG_PROVENANCE, or
  trusted publishing with `id-token: write`), which npm signs with Sigstore; or a stack-neutral
  signature: cosign, GoReleaser, gpg.
fix:
  human: "Publish with `npm publish --provenance` from a job with `id-token: write`, or use trusted publishing."
refs: ["https://fleetlint.org/stacks/#nodejs--typescript", "https://docs.npmjs.com/generating-provenance-statements"]
