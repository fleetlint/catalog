id: release/signing/gem
kind: outcome
satisfiers:
  - name: release-gem
    expr: >
      artifact.workflows.exists(w, text(w).matches("id-token:\\s*write") && steps(w).exists(s,
        s.uses.startsWith("rubygems/release-gem") && !("attestations" in s.with && (s.with.attestations == false || s.with.attestations == "false"))))
  - name: gem-cert
    expr: glob("*.gemspec").exists(f, text(f).matches("\\bsigning_key\\s*=") && text(f).matches("\\bcert_chain\\s*="))
requirement: >
  Gems are pushed by rubygems/release-gem with trusted publishing (Sigstore attestations) or signed
  with a certificate (`signing_key` and `cert_chain` in the gemspec).
fix:
  human: "Release with rubygems/release-gem and trusted publishing (`id-token: write`)."
refs:
  - {url: "https://guides.rubygems.org/trusted-publishing/", kind: spec}
  - {url: "https://guides.rubygems.org/security/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
