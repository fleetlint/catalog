id: release/signing/oci-artifact
kind: outcome
satisfiers:
  # The digest comes from the push step's output or an environment variable, never a tag.
  - name: cosign-by-digest
    expr: >
      artifact_workflows("oci-artifact").exists(w, steps(w).exists(s,
        s.run.matches("\\bcosign sign\\b[^\\n]*(@sha256:|@\\$\\{\\{|@\\$\\{?[A-Z_]*DIGEST|\\$\\{\\{\\s*steps\\.[^}]*\\.outputs\\.digest)")
        || glob("**/*.sh").exists(f, s.run.contains(f) && text(f).matches("\\bcosign sign\\b[^\\n]*(@sha256:|@\\$\\{?[A-Za-z_]*[Dd][Ii][Gg][Ee][Ss][Tt])"))))
  - name: notation
    expr: artifact_workflows("oci-artifact").exists(w, steps(w).exists(s, s.run.matches("\\bnotation sign\\b")))
partials:
  - name: cosign-by-tag
    severity: warning
    expr: artifact_workflows("oci-artifact").exists(w, steps(w).exists(s, s.run.matches("\\bcosign sign\\b")))
    message: "the artifact is signed by tag, not by digest: a tag can move after signing"
  - name: cosign-outside-release
    severity: warning
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
    message: "cosign is installed in a workflow but the workflow that pushes the artifact does not sign it"
requirement: >
  The workflow that pushes the artifact signs it by digest (`cosign sign <repository>@<digest>`, the
  digest from the push step's output; `oras push` prints it and `--format go-template` extracts it),
  or with Notation. Signing by tag is a partial: a tag can be moved after signing. A consumer pins
  the digest or verifies the signature against the publishing workflow's identity.
fix:
  human: "Capture the digest of `oras push` (for example `--format go-template='{{.digest}}'`) and run `cosign sign --yes <repository>@<digest>` with `id-token: write` on the job (keyless) or `--key` on Gitea."
  agent: "Add sigstore/cosign-installer; have the push step write the digest to `$GITHUB_OUTPUT`; after it run `cosign sign --yes <registry>/<repository>@${{ steps.<id>.outputs.digest }}`; grant `id-token: write` and `packages: write` to that job only."
refs:
  - {url: "https://docs.sigstore.dev/cosign/signing/signing_with_containers/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
