id: release/signing/ruby
kind: outcome
satisfiers:
  # rubygems/release-gem pushes with trusted publishing and attaches Sigstore attestations.
  - name: release-gem
    expr: >
      tagged_workflows().exists(w, text(w).matches("id-token:\\s*write") && steps(w).exists(s,
        s.uses.startsWith("rubygems/release-gem") && !("attestations" in s.with && (s.with.attestations == false || s.with.attestations == "false"))))
  - name: gem-cert
    expr: glob("*.gemspec").exists(f, text(f).matches("\\bsigning_key\\s*=") && text(f).matches("\\bcert_chain\\s*="))
partials:
  - name: cosign-outside-release
    severity: warning
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("sigstore/cosign-installer") || s.run.contains("cosign ")))
    message: "cosign is installed in a workflow but no tag-triggered release signs its artifacts"
requirement: >
  Gems are pushed by rubygems/release-gem with trusted publishing (Sigstore attestations) or signed with
  a certificate (`signing_key` and `cert_chain` in the gemspec); or a stack-neutral signature: cosign,
  GoReleaser, gpg.
fix:
  human: "Release with rubygems/release-gem and trusted publishing (`id-token: write`)."
refs: ["https://fleetlint.org/stacks/#ruby", "https://guides.rubygems.org/trusted-publishing/"]
