id: release/changelog-in-release
title: Release notes are generated from commits
kind: outcome
severity: info
tiers: [1]
scope: root
when: release.exists && tagged_workflows().size() > 0
satisfiers:
  - name: goreleaser-changelog
    expr: >
      [".goreleaser.yaml", ".goreleaser.yml"].exists(f, file(f) && !(type(yaml(f)) == map && "changelog" in yaml(f)
        && type(yaml(f).changelog) == map && "disable" in yaml(f).changelog && yaml(f).changelog.disable == true))
  - name: git-cliff
    expr: tagged_workflows().exists(w, steps(w).exists(s, s.uses.startsWith("orhun/git-cliff-action") || s.run.matches("\\bgit[- ]cliff\\b")))
  - name: release-please-or-changesets
    expr: workflows().exists(w, steps(w).exists(s, s.uses.startsWith("googleapis/release-please-action") || s.uses.startsWith("changesets/action")))
  - name: changelog-section
    expr: >
      tagged_workflows().exists(w, steps(w).exists(s, s.run.contains("CHANGELOG.md")
        && s.run.matches("\\b(awk|sed|git-cliff|changelog|parse-changelog)\\b")))
message: "release notes are not generated from the commit history"
requirement: "Release notes come from git-cliff, GoReleaser's changelog, release-please, changesets, or the release's own section cut from the generated CHANGELOG.md, so they match the CHANGELOG."
rationale: Hand-written release notes drift from the changelog and from what was shipped.
fix:
  human: "Use git-cliff --latest --strip header as the release body."
  agent: "Add a step that runs `git-cliff --latest --strip header -o release-notes.md` and pass it as the release body."
refs:
  - {url: "https://keepachangelog.com/en/1.1.0/", kind: standard, section: "How do I make a good changelog?"}
  - {url: "https://fleetlint.org/baseline/#releases", kind: convention}
