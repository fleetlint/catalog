id: repo/lockfile-committed/rust
kind: expr
expr: '"Cargo.lock" in tracked() || !text("Cargo.toml").matches(r''\[((workspace\.)?(dev-|build-)?dependencies|workspace)\]'')'
message: "Cargo.lock is not tracked"
requirement: "Cargo.lock is tracked when Cargo.toml declares dependencies or a workspace."
fix:
  human: "Run `cargo generate-lockfile` and commit Cargo.lock."
refs: ["https://fleetlint.org/stacks/#rust"]
