id: repo/lockfile-committed/node
kind: expr
locate: '"package-lock.json"'
expr: >
  tracked().exists(f, f in ["package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb"])
  || ["../", "../../", "../../../"].exists(d, (file(d + "pnpm-workspace.yaml") || (file(d + "package.json") && text(d + "package.json").matches(r'"workspaces"\s*:')))
       && ["package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb"].exists(n, file(d + n)))
  || !(text("package.json").matches(r'"(dev|optional)?[dD]ependencies"\s*:\s*\{\s*"|"workspaces"\s*:') || file("pnpm-workspace.yaml"))
message: "no Node lockfile is tracked"
requirement: "package-lock.json, npm-shrinkwrap.json, pnpm-lock.yaml, yarn.lock or bun.lock is tracked when package.json declares dependencies or workspaces; a workspace member uses the lockfile at the workspace root (a parent directory with `workspaces` in package.json or pnpm-workspace.yaml)."
fix:
  human: "Run the package manager's install and commit its lockfile."
refs:
  - {url: "https://docs.npmjs.com/cli/v11/configuring-npm/package-lock-json", kind: spec}
  - "https://fleetlint.org/stacks/#nodejs--typescript"
