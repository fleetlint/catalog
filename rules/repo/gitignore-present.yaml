id: repo/gitignore-present
title: A .gitignore exists
kind: expr
severity: warning
scope: root
locate: .gitignore
expr: file(".gitignore")
message: ".gitignore is missing"
requirement: The repository root has a .gitignore.
rationale: Without one, build output and local files end up tracked.
fix:
  human: "Add a .gitignore for the stack (gitignore.io or the stack template)."
  agent: "Create .gitignore with the standard patterns for the detected stacks and OS/editor files."
  actions:
    - gitignore: [".DS_Store", "*.log", ".env", ".env.*", "!.env.example"]
refs:
  - {url: "https://git-scm.com/docs/gitignore", kind: spec}
  - {url: "https://docs.github.com/en/get-started/git-basics/ignoring-files", kind: guidance}
  - "https://fleetlint.org/baseline/#hygiene"
