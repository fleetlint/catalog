id: repo/toolchain-pinned/dotnet
kind: expr
locate: '"global.json"'
expr: >
  ["", "../", "../../", "../../../"].exists(d, file(d + "global.json") && text(d + "global.json").matches(r'"version"\s*:\s*"\d'))
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(dotnet|dotnet-core)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(dotnet|dotnet-core)"?\s*=\s*[^#\n]*\d').size() > 0))
message: "global.json pins no .NET SDK"
requirement: "global.json sets `sdk.version`, or `.tool-versions`/mise names dotnet with a version."
fix:
  human: "Run `dotnet new globaljson --sdk-version <version> --roll-forward latestFeature`."
refs:
  - {url: "https://learn.microsoft.com/en-us/dotnet/core/tools/global-json", kind: spec}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - "https://fleetlint.org/stacks/#net"
