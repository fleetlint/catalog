id: repo/toolchain-pinned/python
kind: expr
locate: '".python-version"'
expr: >
  ["", "../", "../../", "../../../"].exists(d, file(d + ".python-version") && scan(d + ".python-version", r'^\s*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(python)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(python)"?\s*=\s*[^#\n]*\d').size() > 0))
  || ["", "../", "../../", "../../../"].exists(d, file(d + "devbox.json") && text(d + "devbox.json").matches(r'"(python|python3)(@v?\d|"\s*:\s*("v?\d|\{[^}]*"version"\s*:\s*"v?\d))|"(python3\d+)(@[^"]*)?"'))
message: "no Python version is pinned"
requirement: "`.python-version` names a version, or `.tool-versions`/mise or `devbox.json` names python with a version. `requires-python` is a range, not a pin. In `devbox.json` the package needs a version (`python@3.13`, `python313`); `@latest` does not count."
fix:
  human: "Run `uv python pin 3.x` (writes .python-version)."
refs:
  - {url: "https://docs.astral.sh/uv/concepts/python-versions/", kind: spec}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - {url: "https://github.com/jetify-com/devbox/blob/main/.schema/devbox.schema.json", kind: spec}
  - "https://fleetlint.org/stacks/#python"
