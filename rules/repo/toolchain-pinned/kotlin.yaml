id: repo/toolchain-pinned/kotlin
kind: expr
locate: '(["build.gradle.kts", "build.gradle"].filter(f, file(f)) + ["build.gradle.kts"])[0]'
expr: >
  ["", "../", "../../", "../../../"].exists(d, file(d + ".java-version") && scan(d + ".java-version", r'^\s*\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".sdkmanrc") && scan(d + ".sdkmanrc", r'^\s*java\s*=\s*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, file(d + "gradle/gradle-daemon-jvm.properties") && text(d + "gradle/gradle-daemon-jvm.properties").matches(r'toolchainVersion\s*=\s*\d'))
  || (glob("**/build.gradle*") + ["../", "../../", "../../../"].map(d, [d + "build.gradle", d + "build.gradle.kts"]).flatten().filter(f, file(f)))
       .exists(f, text(f).matches(r'languageVersion(\.set\(|\s*=\s*)\s*JavaLanguageVersion\.of\(\s*\d|jvmToolchain\s*\(\s*\d'))
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(java)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(java)"?\s*=\s*[^#\n]*\d').size() > 0))
  || ["", "../", "../../", "../../../"].exists(d, file(d + "devbox.json") && text(d + "devbox.json").matches(r'"(jdk|openjdk|temurin-bin|zulu|corretto|graalvm-ce)(@v?\d|"\s*:\s*("v?\d|\{[^}]*"version"\s*:\s*"v?\d))|"((jdk|openjdk|zulu|corretto)\d+|temurin-bin-\d+)(@[^"]*)?"'))
message: "no JDK version is pinned"
requirement: "The JDK is pinned: a Gradle toolchain in the project's or a parent build (`jvmToolchain(n)`, `JavaLanguageVersion.of(n)`), `gradle-daemon-jvm.properties`, `.java-version`, `.sdkmanrc` with `java=`, or `.tool-versions`/mise or `devbox.json` naming java. The Gradle wrapper pins Gradle, not the JDK; the Kotlin version is pinned by the plugin version already. In `devbox.json` the package needs a version (`jdk@21`, `jdk21`); `@latest` does not count."
fix:
  human: "Add `kotlin { jvmToolchain(21) }` to the build."
refs:
  - {url: "https://kotlinlang.org/docs/gradle-configure-project.html", kind: spec}
  - {url: "https://docs.gradle.org/current/userguide/toolchains.html", kind: spec}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - {url: "https://github.com/jetify-com/devbox/blob/main/.schema/devbox.schema.json", kind: spec}
  - "https://fleetlint.org/stacks/#kotlin-jvm--android"
