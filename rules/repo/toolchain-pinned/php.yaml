id: repo/toolchain-pinned/php
kind: expr
locate: '".php-version"'
expr: >
  ["", "../", "../../", "../../../"].exists(d, file(d + ".php-version") && scan(d + ".php-version", r'^\s*\d').size() > 0)
  || (file("composer.json") && text("composer.json").matches(r'"platform"\s*:\s*\{[^}]*"php"\s*:\s*"\d'))
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(php)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(php)"?\s*=\s*[^#\n]*\d').size() > 0))
  || ["", "../", "../../", "../../../"].exists(d, file(d + "devbox.json") && text(d + "devbox.json").matches(r'"(php)(@v?\d|"\s*:\s*("v?\d|\{[^}]*"version"\s*:\s*"v?\d))|"(php\d+)(@[^"]*)?"'))
message: "no PHP version is pinned"
requirement: "`.php-version` names a version, composer.json's `config.platform.php` fixes the PHP version dependencies are resolved for, or `.tool-versions`/mise or `devbox.json` names php with a version. In `devbox.json` the package needs a version (`php@8.4`, `php84`); `@latest` does not count."
fix:
  human: "Write the PHP version to .php-version (setup-php reads it)."
refs:
  - {url: "https://getcomposer.org/doc/06-config.md", kind: spec, section: "platform"}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - {url: "https://github.com/jetify-com/devbox/blob/main/.schema/devbox.schema.json", kind: spec}
  - "https://fleetlint.org/stacks/#php"
