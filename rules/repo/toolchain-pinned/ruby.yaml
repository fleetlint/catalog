id: repo/toolchain-pinned/ruby
kind: expr
locate: '".ruby-version"'
expr: >
  ["", "../", "../../", "../../../"].exists(d, file(d + ".ruby-version") && scan(d + ".ruby-version", r'^\s*(ruby-)?\d').size() > 0)
  || scan("Gemfile", r'^\s*ruby\s+["\x27]\d').size() > 0
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(ruby)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(ruby)"?\s*=\s*[^#\n]*\d').size() > 0))
  || ["", "../", "../../", "../../../"].exists(d, file(d + "devbox.json") && text(d + "devbox.json").matches(r'"(ruby)(@v?\d|"\s*:\s*("v?\d|\{[^}]*"version"\s*:\s*"v?\d))|"(ruby_\d+_\d+)(@[^"]*)?"'))
message: "no Ruby version is pinned"
requirement: "`.ruby-version` names a version, the Gemfile declares `ruby \"x.y.z\"`, or `.tool-versions`/mise or `devbox.json` names ruby with a version. In `devbox.json` the package needs a version (`ruby@3.4`, `ruby_3_4`); `@latest` does not count."
fix:
  human: "Write the Ruby version to .ruby-version."
refs:
  - {url: "https://guides.rubygems.org/gemfile_ruby/", kind: spec}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - {url: "https://github.com/jetify-com/devbox/blob/main/.schema/devbox.schema.json", kind: spec}
  - "https://fleetlint.org/stacks/#ruby"
