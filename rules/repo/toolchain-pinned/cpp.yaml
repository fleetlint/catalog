id: repo/toolchain-pinned/cpp
kind: expr
expr: >
  scan(".tool-versions", r'^\s*(cmake|clang|llvm|gcc|conan|ninja|meson)\s+\S*\d').size() > 0
  || ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(f,
       scan(f, r'^\s*"?(cmake|clang|llvm|gcc|conan|ninja|meson)"?\s*=\s*[^#\n]*\d').size() > 0)
  || (glob(".conan/profiles/*") + glob("conan/profiles/*") + glob("profiles/*")).exists(f, text(f).matches(r'(?m)^\s*compiler\.version\s*=\s*\d'))
  || [".devcontainer/devcontainer.json", ".devcontainer.json"].exists(f, file(f) && text(f).matches(r'"image"\s*:\s*"[^"]+@sha256:'))
message: "no C/C++ toolchain version is pinned"
requirement: "The compiler or build tool is pinned: `.tool-versions`/mise naming cmake, clang/llvm, gcc, conan, ninja or meson with a version, a Conan profile with `compiler.version`, or a dev container image pinned by digest. `cmake_minimum_required` is a floor, not a pin."
fix:
  human: "Pin the toolchain with mise (`mise use cmake@3.x clang@18`) or build in a digest-pinned dev container image."
refs: ["https://fleetlint.org/stacks/#cc"]
