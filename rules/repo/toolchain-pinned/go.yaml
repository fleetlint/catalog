id: repo/toolchain-pinned/go
kind: expr
expr: >
  scan("go.mod", r'^(toolchain go\d+\.\d+|go \d+\.\d+\.\d+)').size() > 0
  || scan(".tool-versions", r'^\s*(go|golang)\s+\S*\d').size() > 0
  || ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(f,
       scan(f, r'^\s*"?(go|golang)"?\s*=\s*[^#\n]*\d').size() > 0)
message: "go.mod pins no exact Go version"
requirement: "go.mod has a `toolchain` directive or a full `go 1.x.y` version, or `.tool-versions`/mise names go with a version."
fix:
  human: "Set `go 1.x.y` (or a `toolchain go1.x.y` line) in go.mod."
refs: ["https://fleetlint.org/stacks/#go"]
