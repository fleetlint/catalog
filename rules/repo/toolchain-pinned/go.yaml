id: repo/toolchain-pinned/go
kind: expr
locate: '"go.mod"'
expr: >
  scan("go.mod", r'^(toolchain go\d+\.\d+|go \d+\.\d+\.\d+)').size() > 0
  || ["../", "../../", "../../../"].exists(d, file(d + "go.work") && scan(d + "go.work", r'^(toolchain go\d+\.\d+|go \d+\.\d+\.\d+)').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, file(d + ".tool-versions") && scan(d + ".tool-versions", r'^\s*(go|golang)\s+\S*\d').size() > 0)
  || ["", "../", "../../", "../../../"].exists(d, ["mise.toml", ".mise.toml", ".config/mise.toml", ".config/mise/config.toml", "mise/config.toml"].exists(n,
       file(d + n) && scan(d + n, r'^\s*"?(go|golang)"?\s*=\s*[^#\n]*\d').size() > 0))
  || ["", "../", "../../", "../../../"].exists(d, file(d + "devbox.json") && text(d + "devbox.json").matches(r'"(go)(@v?\d|"\s*:\s*("v?\d|\{[^}]*"version"\s*:\s*"v?\d))|"(go_\d+_\d+)(@[^"]*)?"'))
message: "go.mod pins no exact Go version"
requirement: "go.mod (or the go.work of a parent workspace) has a `toolchain` directive or a full `go 1.x.y` version, or `.tool-versions`/mise or `devbox.json` names go with a version. In `devbox.json` the package needs a version (`go@1.27.4`); `@latest` does not count."
fix:
  human: "Set `go 1.x.y` (or a `toolchain go1.x.y` line) in go.mod."
refs:
  - {url: "https://go.dev/doc/toolchain", kind: spec, section: "Go toolchain selection"}
  - {url: "https://mise.jdx.dev/configuration.html", kind: spec}
  - {url: "https://github.com/jetify-com/devbox/blob/main/.schema/devbox.schema.json", kind: spec}
  - "https://fleetlint.org/stacks/#go"
