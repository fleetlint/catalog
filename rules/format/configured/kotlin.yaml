id: format/configured/kotlin
kind: outcome
locate: '(["build.gradle.kts", "build.gradle"].filter(f, file(f)) + ["build.gradle.kts"])[0]'
satisfiers:
  - name: spotless
    expr: >
      (["", "../", "../../", "../../../"].map(d, [d + "pom.xml", d + "build.gradle", d + "build.gradle.kts"]).flatten() + glob("buildSrc/**/*.gradle*") + glob("build-logic/**/*.gradle*"))
        .exists(f, file(f) && text(f).matches("spotless"))
  - name: ktlint-or-ktfmt
    expr: >
      (["", "../", "../../", "../../../"].map(d, [d + "pom.xml", d + "build.gradle", d + "build.gradle.kts"]).flatten() + glob("buildSrc/**/*.gradle*") + glob("build-logic/**/*.gradle*"))
        .exists(f, file(f) && text(f).matches("org\\.jlleitschuh\\.gradle\\.ktlint|ktlint|ktfmt"))
  - name: formatter-run
    expr: >
      ["", "../", "../../", "../../../"].exists(d, [d + ".pre-commit-config.yaml", d + "lefthook.yml", d + "lefthook.yaml", d + ".lefthook.yml", d + "Makefile", d + "justfile", d + "Taskfile.yml"]
        .exists(f, file(f) && text(f).matches("\\bktlint\\b|\\bktfmt\\b|spotless(Check|Apply)")))
      || (taskrunner.file != "" && text(taskrunner.file).matches("\\bktlint\\b|\\bktfmt\\b|spotless(Check|Apply)"))
      || workflows().exists(w, text(w).matches("\\bktlint\\b|\\bktfmt\\b|spotless(Check|Apply)"))
message: "no Kotlin formatter in the build (Spotless, ktlint or ktfmt)"
requirement: "A formatter is wired into the Gradle build (this build, a parent build or a convention plugin): Spotless, ktlint or ktfmt, or one runs in a hook, the task runner or CI. Another formatter is added with `accept:`."
fix:
  human: "Add Spotless with ktlint (or ktfmt) to the Gradle build and run spotlessCheck in the hooks."
  agent: "Add the Spotless Gradle plugin with ktlint() for Kotlin sources, spotlessCheck to the lint target and a hook; reformat in a separate commit."
refs:
  - {url: "https://kotlinlang.org/docs/coding-conventions.html", kind: guidance, section: "Formatting"}
  - {url: "https://github.com/diffplug/spotless", kind: spec}
  - "https://fleetlint.org/stacks/#kotlin-jvm--android"
