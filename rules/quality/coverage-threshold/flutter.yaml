id: quality/coverage-threshold/flutter
kind: outcome
locate: 'taskrunner.file != "" ? taskrunner.file : "Makefile"'
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: very-good-min-coverage
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bvery_good\s+test\b[^;&|]*--min-coverage') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'\bvery_good\s+test\b[^;&|]*--min-coverage') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\bvery_good\s+test\b[^;&|]*--min-coverage') && !l.matches(params.skip))))
requirement: "`very_good test --min-coverage` runs in a recipe or a CI step, or a stack-neutral floor applies (diff-cover `--fail-under` on lcov, codecov `target`)."
fix:
  human: "Run `very_good test --coverage --min-coverage 80` in the `cover` target."
refs:
  - {url: "https://cli.vgv.dev/docs/commands/test", kind: spec}
  - "https://fleetlint.org/stacks/#flutter--dart"
