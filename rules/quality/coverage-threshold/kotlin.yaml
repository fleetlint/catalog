id: quality/coverage-threshold/kotlin
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
satisfiers:
  - name: jacoco-maven
    expr: >
      ["", "../", "../../", "../../../"].map(d, d + "pom.xml").exists(p, file(p) && text(p).contains("jacoco-maven-plugin")
      && text(p).matches(r'<goal>\s*check\s*</goal>') && text(p).matches(r'<minimum>\s*[0-9.]+'))
  - name: gradle-verification
    expr: >
      (glob("**/build.gradle*") + ["../", "../../", "../../../"].map(d, [d + "build.gradle", d + "build.gradle.kts"]).flatten().filter(f, file(f))).exists(f, text(f).matches(r'minBound\s*\(|violationRules|jacocoTestCoverageVerification[\s\S]*minimum'))
requirement: "JaCoCo's `check` goal with a `<minimum>` in pom.xml, JaCoCo `violationRules` (jacocoTestCoverageVerification) or Kover `minBound` verification in a Gradle build, or a stack-neutral floor applies."
fix:
  human: "Add a Kover (or JaCoCo) verification rule with a minimum and run its verify task in `cover`."
refs: ["https://fleetlint.org/stacks/#kotlin-jvm--android"]
