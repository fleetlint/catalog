id: quality/coverage-threshold/dotnet
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: coverlet-threshold
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'[/-]p:Threshold=\d|--threshold\s+\d') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'[/-]p:Threshold=\d|--threshold\s+\d') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'[/-]p:Threshold=\d|--threshold\s+\d') && !l.matches(params.skip))))
  - name: coverlet-property
    expr: >
      (glob("**/*.csproj") + glob("**/*.fsproj") + glob("**/Directory.Build.props") + ["../", "../../", "../../../"].map(d, d + "Directory.Build.props").filter(f, file(f))).exists(f, text(f).matches(r'<Threshold>\s*\d'))
requirement: "coverlet enforces a minimum: `/p:Threshold=…` on `dotnet test`, `--threshold` for the coverlet tool, or `<Threshold>` in a project or Directory.Build.props; or a stack-neutral floor applies."
fix:
  human: "Run `dotnet test /p:CollectCoverage=true /p:Threshold=80` in the `cover` target."
refs: ["https://fleetlint.org/stacks/#net"]
