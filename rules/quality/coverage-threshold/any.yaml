id: quality/coverage-threshold/any
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
satisfiers:
  - name: cover-target
    when: '"cover" in taskrunner.recipes'
    expr: >
      taskrunner.recipes["cover"].exists(l, !l.matches(params.skip)
        && l.matches(r'fail[-_]?under|coverageThreshold|min(imum)?[-_]?coverage|COVER(AGE)?_MIN|\s-lt\s|<\s*\$'))
  - name: diff-cover
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bdiff-cover\b[^;&|]*--fail-under') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\bdiff-cover\b[^;&|]*--fail-under') && !l.matches(params.skip))))
  - name: codecov
    expr: >
      [".codecov.yml", "codecov.yml", ".github/codecov.yml", ".codecov.yaml", "codecov.yaml"].exists(f,
        file(f) && scan(f, r'^\s*target:\s*\S').size() > 0)
requirement: "The `cover` recipe compares coverage with a minimum (a fail-under option, a `COVER_MIN` comparison), diff-cover runs with `--fail-under`, or codecov.yml sets a status `target`. Comments and `echo` lines do not count."
