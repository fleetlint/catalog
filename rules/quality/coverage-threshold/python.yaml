id: quality/coverage-threshold/python
kind: outcome
locate: pyproject.toml
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: coverage-config
    expr: >
      ["", "../", "../../", "../../../"].exists(d, ["pyproject.toml", "setup.cfg", ".coveragerc", "tox.ini", "pytest.ini"].exists(n, file(d + n)
        && scan(d + n, r'^\s*(fail_under\s*=\s*\d|[^#]*--cov-fail-under)').size() > 0))
  - name: fail-under
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'--cov-fail-under|\bcoverage report\b[^;&|]*--fail-under') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'--cov-fail-under|\bcoverage report\b[^;&|]*--fail-under') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'--cov-fail-under|\bcoverage report\b[^;&|]*--fail-under') && !l.matches(params.skip))))
requirement: "coverage.py's `fail_under` is set (pyproject.toml, setup.cfg, .coveragerc, tox.ini) or pytest runs with `--cov-fail-under` (in its addopts, a recipe or a CI step), or a stack-neutral floor applies."
fix:
  human: "Set `[tool.coverage.report] fail_under = 80` in pyproject.toml."
refs:
  - {url: "https://coverage.readthedocs.io/en/latest/config.html", kind: spec}
  - "https://fleetlint.org/stacks/#python"
