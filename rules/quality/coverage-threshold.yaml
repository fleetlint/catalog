id: quality/coverage-threshold
title: A coverage floor is enforced
kind: capability
severity: warning
tiers: [1, 2]
message: "nothing enforces a minimum coverage"
requirement: >
  Tests fail below a coverage floor: the stack's coverage tool configured with a minimum, a threshold in the
  `cover` recipe, diff-cover `--fail-under`, or a codecov `target`. Comments and `echo` lines do not count.
  For a workspace member the repository's CI and configuration files in parent directories count as well.
rationale: A coverage number nobody enforces drifts down one "quick fix" at a time.
fix:
  human: "Make `make cover` fail below the floor (diff-cover --fail-under=80 is the stack-neutral option)."
  agent: "Add a threshold to the cover recipe using the stack profile's tool (go: go-test-coverage or a cover script with a minimum; python: --cov-fail-under; node: coverageThreshold; rust: cargo llvm-cov --fail-under-lines; kotlin: kover verify)."
refs:
  - {url: "https://fleetlint.org/baseline/#tests", kind: convention}
