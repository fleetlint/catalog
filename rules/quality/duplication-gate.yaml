id: quality/duplication-gate
title: Duplicated code is measured
kind: outcome
severity: info
scope: root
tiers: [1]
satisfiers:
  - name: task-runner-or-ci
    expr: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", "package.json", "build.gradle", "build.gradle.kts", ".pre-commit-config.yaml", "pyproject.toml"].exists(f,
        text(f).matches("\\b(jscpd|cpdCheck|pmd[- ]cpd|simian|duplo)\\b"))
      || workflows().exists(w, text(w).matches("\\b(jscpd|cpdCheck|pmd[- ]cpd|simian|duplo)\\b"))
  - name: golangci-dupl
    expr: >
      [".golangci.yml", ".golangci.yaml"].exists(f, file(f) && yaml(f) != null && has(yaml(f).linters) && yaml(f).linters != null
        && !(has(yaml(f).linters.disable) && yaml(f).linters.disable != null && "dupl" in yaml(f).linters.disable)
        && ((has(yaml(f).linters.enable) && yaml(f).linters.enable != null && "dupl" in yaml(f).linters.enable)
            || (has(yaml(f).linters.default) && yaml(f).linters.default == "all")
            || ("enable-all" in yaml(f).linters && yaml(f).linters["enable-all"] == true)))
  - name: pylint
    when: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", ".pre-commit-config.yaml", "tox.ini", "noxfile.py"].exists(f, text(f).matches("\\bpylint\\b"))
      || workflows().exists(w, text(w).matches("\\bpylint\\b"))
    expr: >
      ![".pylintrc", "pylintrc", "setup.cfg", "pyproject.toml", "tox.ini", taskrunner.file, ".pre-commit-config.yaml"].exists(f,
        text(f).matches("(?s)disable\\s*=\\s*(\\[[^\\]]*?|[^\\[=]*?)(duplicate-code|R0801)"))
  - name: config-file
    expr: exists(".jscpd.json") || exists("sonar-project.properties")
message: "no duplication check is configured"
requirement: "A duplication detector runs in the task runner, the hooks or CI and is not switched off: golangci-lint `dupl` enabled (and not in `disable`), `jscpd` for any stack, PMD CPD for JVM, pylint with `duplicate-code` (R0801) not disabled, or Sonar. Another tool is added with `accept:`."
rationale: Near-duplicate implementations are how a fix lands in one copy and not the other; a detector makes the second copy visible at review time.
fix:
  human: "Enable `dupl` in .golangci.yml, or add `jscpd` to the lint target (see https://fleetlint.org/stacks/ for the stack's tool)."
  agent: "Add the stack's duplication detector to the lint target with a threshold, and remove or merge the duplicates it reports rather than raising the threshold."
refs: ["https://fleetlint.org/baseline/#design"]
