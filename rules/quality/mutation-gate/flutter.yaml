id: quality/mutation-gate/flutter
kind: outcome
satisfiers:
  - name: task-runner-or-ci
    expr: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", "package.json", "build.gradle", "build.gradle.kts", "pyproject.toml", "composer.json"].exists(f,
        text(f).matches("\\bmutation_test\\b"))
      || workflows().exists(w, text(w).matches("\\bmutation_test\\b"))
  - name: config-file
    expr: exists("mutation_test*.xml")
requirement: "mutation_test runs on the core libraries, from the task runner or a workflow."
fix:
  human: "Add the mutation_test package with a rules file for lib/ and run it weekly."
refs:
  - {url: "https://pub.dev/packages/mutation_test", kind: spec}
  - "https://fleetlint.org/stacks/#flutter--dart"
