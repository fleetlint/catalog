id: quality/mutation-gate/node
kind: outcome
satisfiers:
  - name: task-runner-or-ci
    expr: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", "package.json", "build.gradle", "build.gradle.kts", "pyproject.toml", "composer.json"].exists(f,
        text(f).matches("\\bstryker\\b"))
      || workflows().exists(w, text(w).matches("\\bstryker\\b"))
  - name: config-file
    expr: exists("stryker.conf.*") || exists("stryker.config.*")
requirement: "StrykerJS runs on the core modules, from the task runner or a workflow."
fix:
  human: "Add StrykerJS (`stryker.config.mjs` with `thresholds.break`) and run `npx stryker run` weekly."
refs:
  - {url: "https://stryker-mutator.io/docs/stryker-js/introduction/", kind: spec}
  - "https://fleetlint.org/stacks/#nodejs--typescript"
