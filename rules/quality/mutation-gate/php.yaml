id: quality/mutation-gate/php
kind: outcome
satisfiers:
  - name: task-runner-or-ci
    expr: >
      [taskrunner.file, "Makefile", "justfile", "Taskfile.yml", "package.json", "build.gradle", "build.gradle.kts", "pyproject.toml", "composer.json"].exists(f,
        text(f).matches("\\binfection\\b"))
      || workflows().exists(w, text(w).matches("\\binfection\\b"))
  - name: config-file
    expr: exists("infection.json*")
requirement: "Infection runs on the core code, from the task runner or a workflow."
fix:
  human: "Add infection/infection with `minMsi` in infection.json5 and run it weekly."
refs:
  - {url: "https://infection.github.io/", kind: spec}
  - "https://fleetlint.org/stacks/#php"
