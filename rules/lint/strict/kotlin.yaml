id: lint/strict/kotlin
kind: expr
title: detekt enforces the exception and size rules
# Where detekt is applied or configured; without a configuration the rules below are not guaranteed to be on.
when: >
  exists("**/detekt*.yml") || exists("**/detekt*.yaml")
  || ["../", "../../", "../../../"].exists(d, file(d + "config/detekt/detekt.yml"))
  || (["", "../", "../../", "../../../"].map(d, [d + "build.gradle", d + "build.gradle.kts", d + "settings.gradle.kts", d + "settings.gradle"]).flatten()
    + glob("buildSrc/**/*.gradle*") + glob("build-logic/**/*.gradle*"))
    .exists(f, file(f) && text(f).matches("io\\.gitlab\\.arturbosch\\.detekt|dev\\.detekt|libs\\.plugins\\.detekt|\\bdetekt\\s*\\{"))
params:
  required: [exceptions.SwallowedException, exceptions.TooGenericExceptionCaught, empty-blocks.EmptyCatchBlock, complexity.LongMethod, complexity.CognitiveComplexMethod]
foreach: params.required
expr: >
  (glob("**/detekt*.y*ml") + ["../", "../../", "../../../"].map(d, d + "config/detekt/detekt.yml").filter(f, file(f)))
  .exists(f, [yaml(f)].exists(y, y != null
    && item.split(".")[0] in y && y[item.split(".")[0]] != null
    && item.split(".")[1] in y[item.split(".")[0]] && y[item.split(".")[0]][item.split(".")[1]] != null
    && "active" in y[item.split(".")[0]][item.split(".")[1]]
    && y[item.split(".")[0]][item.split(".")[1]].active == true))
message: "detekt rule is not active"
requirement: "The detekt configuration sets `active: true` for every rule in `params.required` (ruleset.Rule): swallowed and too-generic exceptions, empty catch blocks, method length and cognitive complexity. `detekt --generate-config` writes a full configuration to edit."
rationale: The compiler accepts a swallowed exception and a 400-line method; detekt is the only place these are refused, and only when the rules are on.
fix:
  human: "Set the reported rules to `active: true` in the detekt configuration (thresholds: LongMethod 50, CognitiveComplexMethod 15); `fleetlint fix --apply` writes config/detekt/detekt.yml when there is none, where the detekt Gradle plugin looks by default."
  agent: "Set each reported rule to active: true in the detekt configuration and fix the findings it produces instead of adding a baseline entry."
  actions:
    - template: kotlin/detekt.yml
      to: config/detekt/detekt.yml
refs: ["https://fleetlint.org/stacks/#kotlin-jvm--android"]
