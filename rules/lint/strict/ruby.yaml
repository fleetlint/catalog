id: lint/strict/ruby
kind: expr
title: RuboCop enables new cops
# RuboCop uses the nearest .rubocop.yml and what it inherits; Standard manages its cops itself.
locate: .rubocop.yml
when: >
  ["", "../", "../../", "../../../"].exists(d, file(d + ".rubocop.yml"))
expr: >
  [["", "../", "../../", "../../../"].filter(d, file(d + ".rubocop.yml"))]
  .exists(l, [l[0]].exists(d, [yaml(d + ".rubocop.yml")].exists(y, y != null && (
    (has(y.AllCops) && y.AllCops != null && "NewCops" in y.AllCops && y.AllCops.NewCops == "enable")
    || (has(y.inherit_gem) && y.inherit_gem != null && "standard" in y.inherit_gem)
    || (has(y.inherit_from) && (type(y.inherit_from) == list ? y.inherit_from : dyn([y.inherit_from]))
      .exists(p, file(d + p) && [yaml(d + p)].exists(z, z != null && has(z.AllCops) && z.AllCops != null
        && "NewCops" in z.AllCops && z.AllCops.NewCops == "enable")))))))
message: ".rubocop.yml does not set AllCops NewCops: enable"
requirement: "The nearest `.rubocop.yml`, or a file it inherits from, sets `AllCops: NewCops: enable` (or the configuration inherits Standard), so cops added by RuboCop upgrades run instead of waiting as pending."
rationale: RuboCop adds most new checks as pending; without NewCops enable a project keeps the rule set of the version it started with.
fix:
  human: "Set `NewCops: enable` under AllCops in .rubocop.yml."
  agent: "Set NewCops: enable under AllCops in .rubocop.yml and fix or ratchet (.rubocop_todo.yml) what the new cops report."
refs:
  - {url: "https://docs.rubocop.org/rubocop/latest/versioning.html", kind: spec}
  - "https://fleetlint.org/stacks/#ruby"
