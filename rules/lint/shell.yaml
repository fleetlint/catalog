id: lint/shell
title: Shell scripts are linted
kind: expr
severity: info
scope: root
when: tracked().exists(p, p.endsWith(".sh"))
expr: >
  [".pre-commit-config.yaml", "lefthook.yml", "lefthook.yaml", ".lefthook.yml"].exists(f, file(f) && text(f).contains("shellcheck"))
  || (taskrunner.file != "" && text(taskrunner.file).contains("shellcheck"))
  || workflows().exists(w, text(w).contains("shellcheck"))
message: "shell scripts are tracked but shellcheck runs nowhere"
requirement: "When the repository contains shell scripts, shellcheck runs as a hook (pre-commit or lefthook), in the task runner or in CI (GitHub, Gitea, Forgejo or GitLab)."
rationale: Unquoted variables and unchecked exit codes are the bugs shell scripts ship with, and shellcheck finds them without running anything.
fix:
  human: "Add the shellcheck hook to .pre-commit-config.yaml (or lefthook.yml)."
  agent: "Add the shellcheck hook (and shfmt) to .pre-commit-config.yaml and fix what it reports in the tracked scripts."
refs:
  - {url: "https://google.github.io/styleguide/shellguide.html", kind: style-guide, section: "ShellCheck"}
  - {url: "https://github.com/koalaman/shellcheck", kind: spec}
  - "https://fleetlint.org/baseline/#static-analysis"
