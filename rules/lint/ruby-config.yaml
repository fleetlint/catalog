id: lint/ruby-config
title: RuboCop is configured
kind: expr
severity: warning
stacks: [ruby]
expr: file(".rubocop.yml") || file(".rubocop.yaml") || file(".standard.yml")
message: "no .rubocop.yml (or .standard.yml)"
requirement: "`.rubocop.yml` with `NewCops: enable` and the project's metrics, or Standard's `.standard.yml`; a `.rubocop_todo.yml` is the ratchet, not a permanent allowlist."
rationale: Ruby's flexibility is only safe with a linter that holds the line on method length, complexity and swallowed exceptions.
fix:
  human: "Add .rubocop.yml and the rubocop gems to the Gemfile's development group (`fleetlint fix --apply` does both)."
  agent: "Add .rubocop.yml from the template, add rubocop with rubocop-performance and rubocop-rspec to the Gemfile, and run `rubocop --autocorrect`."
  actions:
    - template: ruby/rubocop.yml
      to: .rubocop.yml
    - append: {file: Gemfile, template: ruby/Gemfile-lint, unless: '(?m)^\s*gem\s+["'']rubocop["'']'}
refs: ["https://fleetlint.org/stacks/#ruby"]
