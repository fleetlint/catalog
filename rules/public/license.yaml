id: public/license
title: Public repository has a LICENSE
kind: expr
severity: error
scope: root
when: repo.public
expr: >
  glob("*").exists(f, f.matches(r'(?i)^(un)?licen[cs]e([.-][^/]*)?$|^copying([.-][^/]*)?$'))
  || exists("LICENSES/*")
message: "LICENSE file is missing"
requirement: "A public repository has a license file at its root: `LICENSE*`, `LICENCE*`, `UNLICENSE`, `COPYING*` (any case), or a REUSE `LICENSES/` directory. The manifest's SPDX identifier is checked by `public/manifest-license`."
rationale: Without a license, nobody may legally use the code.
fix:
  human: "Add LICENSE (MIT or Apache-2.0) with the current year and your name."
  agent: "Ask the user which license; add the LICENSE file and the SPDX identifier to the package manifest."
refs:
  - {url: "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository", kind: guidance}
  - {url: "https://github.com/ossf/scorecard/blob/main/docs/checks.md", kind: standard, section: "License"}
  - {url: "https://reuse.software/spec/", kind: standard}
  - "https://fleetlint.org/baseline/#public-repositories"
