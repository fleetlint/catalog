id: public/manifest-license/php
kind: expr
expr: >
  !file("composer.json") || json("composer.json") == null
  || (has(json("composer.json").type) && json("composer.json").type == "project")
  || has(json("composer.json").license)
message: "composer.json does not declare a license"
requirement: "A library's composer.json has `license` (an SPDX identifier or a list of them); `\"type\": \"project\"` (an application) is not checked."
fix:
  human: "Add `\"license\": \"<SPDX id>\"` to composer.json."
refs: ["https://fleetlint.org/stacks/#php"]
