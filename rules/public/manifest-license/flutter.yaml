id: public/manifest-license/flutter
kind: expr
when: "false"
expr: "true"
requirement: "pubspec.yaml has no license field; pub.dev reads the LICENSE file, which public/license checks."
refs:
  - {url: "https://dart.dev/tools/pub/publishing", kind: spec}
  - "https://fleetlint.org/stacks/#flutter--dart"
