id: public/manifest-license
title: Package manifest declares the license
kind: expr
severity: info
scope: each
tiers: [1]
when: repo.public
foreach: repo.stacks
expr: >
  (item != "node" || !file("package.json")
    || (has(json("package.json").private) && json("package.json").private == true)
    || (has(json("package.json").license) && type(json("package.json").license) == string
        && json("package.json").license.matches(r'^\(?[A-Za-z0-9][A-Za-z0-9.+-]*( (AND|OR|WITH) \(?[A-Za-z0-9][A-Za-z0-9.+-]*\)?)*\)?$')
        && json("package.json").license != "UNLICENSED"))
  && (item != "python" || !file("pyproject.toml")
    || scan("pyproject.toml", r'Private :: Do Not Upload').size() > 0
    || scan("pyproject.toml", r'^\s*license(-files)?\s*=|License ::').size() > 0)
  && (item != "rust" || !file("Cargo.toml")
    || scan("Cargo.toml", r'^\s*publish\s*=\s*false').size() > 0
    || scan("Cargo.toml", r'^\s*(license\s*=\s*"[A-Za-z0-9.+ ()/-]+"|license-file\s*=|license\.workspace\s*=\s*true|license\s*=\s*\{\s*workspace\s*=\s*true)').size() > 0)
message: "the package manifest for this stack does not declare a license"
requirement: "A published package's manifest names its license: an SPDX expression in package.json `license` and Cargo.toml `package.license` (or `license-file`, or the workspace's), a `project.license` or license classifier in pyproject.toml. Packages marked private (`\"private\": true`, `publish = false`, the `Private :: Do Not Upload` classifier) and stacks without such a field are not checked."
rationale: Registries, SBOM tools and license checkers read the manifest, not the LICENSE file.
fix:
  human: "Add the SPDX identifier of the LICENSE file to the manifest; `fleetlint fix --apply` does it for package.json and Cargo.toml when the LICENSE text is one recognised license. GNU licenses are left to you: write `-only` or `-or-later`, which the license text does not decide."
  agent: "Set the manifest's license field to the SPDX identifier matching the LICENSE file; ask if the LICENSE text is not a recognised license."
  actions:
    - set: {file: package.json, key: license, value: "{license}"}
    - set: {file: Cargo.toml, key: package.license, value: "{license}"}
refs: ["https://fleetlint.org/baseline/#public-repositories"]
