id: public/manifest-license
title: Package manifest declares the license
kind: capability
severity: info
scope: each
tiers: [1]
when: repo.public
message: "the package manifest does not declare a license"
requirement: "A published package's manifest names its license with an SPDX expression, so registries, SBOM tools and license checkers see it. Packages marked private or unpublished are not checked; stacks whose manifest has no license field say so."
rationale: Registries, SBOM tools and license checkers read the manifest, not the LICENSE file.
fix:
  human: "Add the SPDX identifier of the LICENSE file to the manifest. GNU licenses are left to you: write `-only` or `-or-later`, which the license text does not decide."
  agent: "Set the manifest's license field to the SPDX identifier matching the LICENSE file; ask if the LICENSE text is not a recognised license."
refs:
  - {url: "https://spdx.org/licenses/", kind: spec}
  - {url: "https://fleetlint.org/baseline/#public-repositories", kind: convention}
