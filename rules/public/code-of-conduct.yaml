id: public/code-of-conduct
title: Public repository has a code of conduct
kind: expr
severity: info
scope: root
tiers: [1]
locate: CODE_OF_CONDUCT.md
when: repo.public
expr: exists("CODE_OF_CONDUCT*") || exists(".github/CODE_OF_CONDUCT*") || exists("docs/CODE_OF_CONDUCT*") || exists(".gitea/CODE_OF_CONDUCT*")
message: "CODE_OF_CONDUCT.md is missing"
requirement: "A code of conduct (Contributor Covenant is fine) with a contact address, at the root or in `.github/`, `docs/` or `.gitea/`."
rationale: Forges surface it in the community profile; contributors look for it before engaging.
fix:
  human: "Add CODE_OF_CONDUCT.md (Contributor Covenant 2.1) with a contact address."
  agent: "Add CODE_OF_CONDUCT.md using the Contributor Covenant 2.1 text; ask the user for the contact address."
refs:
  - {url: "https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-a-code-of-conduct-to-your-project", kind: guidance}
  - {url: "https://www.contributor-covenant.org/", kind: standard}
  - "https://fleetlint.org/baseline/#public-repositories"
