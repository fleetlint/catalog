id: public/no-agent-files
title: Public repositories track no agent instruction files
kind: expr
severity: error
scope: root
when: repo.public
foreach: >
  tracked().filter(f, f.matches(r'(^|/)(CLAUDE(\.local)?|AGENTS|GEMINI)\.md$|(^|/)\.(claude|agent|cursor)/|(^|/)\.(cursorrules|windsurfrules|clinerules)(/|$)|(^|/)\.aider[^/]*(/|$)|(^|/)\.github/copilot-instructions\.md$'))
expr: "false"
message: "an agent instruction file is tracked in a public repository"
requirement: "No agent instruction files are tracked in a public repository: CLAUDE.md, CLAUDE.local.md, AGENTS.md, GEMINI.md, .github/copilot-instructions.md, .cursorrules, .windsurfrules, .clinerules, .aider* and the .claude/, .agent/ and .cursor/ directories stay local (listed in .git/info/exclude)."
rationale: "For projects that keep agent tooling out of their published tree: the files describe one contributor's local setup, not the project, and go stale for everyone else."
fix:
  human: "git rm --cached the files and list them in .git/info/exclude so they stay local."
  agent: "Untrack the listed files with git rm --cached, add them to .git/info/exclude (not .gitignore), and commit."
refs: ["https://fleetlint.org/baseline/#public-repositories", "https://fleetlint.org/slop/#repository-and-files"]
