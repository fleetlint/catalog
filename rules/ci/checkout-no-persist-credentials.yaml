id: ci/checkout-no-persist-credentials
title: Checkout does not leave the token on disk
kind: expr
severity: info
scope: root
tiers: [1]
when: workflows().exists(w, ci_kind(w) != "gitlab" && steps(w).exists(s, s.uses.matches("(^|/)actions/checkout@")))
foreach: >
  workflows().filter(w, ci_kind(w) != "gitlab").map(w,
    steps(w).filter(s, s.uses.matches("(^|/)actions/checkout@")).map(s, {
      "path": w,
      "name": s.job,
      "ok": "persist-credentials" in s.with && (s.with["persist-credentials"] == false || s.with["persist-credentials"] == "false")
    })).flatten()
expr: item.ok
message: "actions/checkout keeps the job token in .git/config (persist-credentials is not false)"
requirement: "Every actions/checkout step in a GitHub, Gitea or Forgejo workflow sets `persist-credentials: false`; a job that pushes passes its token explicitly to the push."
rationale: The persisted token is readable by every later step and ends up in any artifact that includes `.git`.
fix:
  human: "Add `with: { persist-credentials: false }` to each checkout step; give a pushing step its own token."
  agent: "Add `persist-credentials: false` under `with:` of every actions/checkout step in the flagged jobs; where a later step pushes, pass the token to that step explicitly instead."
refs: ["https://fleetlint.org/baseline/#security"]
