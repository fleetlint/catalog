id: ci/sast/ruby
kind: outcome
satisfiers:
  - name: brakeman
    expr: >
      workflows().exists(w, steps(w).exists(s, s.run.matches("\\bbrakeman\\b")))
      || [".pre-commit-config.yaml", taskrunner.file, "Rakefile"].exists(f, text(f).matches("\\bbrakeman\\b"))
requirement: "Brakeman (taint analysis for Rails) runs in CI or the task runner; or a stack-neutral scanner (CodeQL, Semgrep, GitLab SAST, SonarQube)."
fix:
  human: "Add `bundle exec brakeman --no-pager` to the check workflow, or a CodeQL/Semgrep step."
refs: ["https://fleetlint.org/stacks/#ruby", "https://brakemanscanner.org/"]
