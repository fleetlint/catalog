id: ci/sast/php
kind: outcome
satisfiers:
  - name: psalm-taint
    expr: >
      workflows().exists(w, steps(w).exists(s, s.run.matches("\\bpsalm\\b[^\\n]*--taint-analysis")))
      || [taskrunner.file, "composer.json", ".pre-commit-config.yaml"].exists(f, text(f).matches("\\bpsalm\\b[^\\n]*--taint-analysis"))
requirement: "Psalm's taint analysis (`psalm --taint-analysis`) runs in CI or the task runner; or a stack-neutral scanner (CodeQL, Semgrep, GitLab SAST, SonarQube)."
fix:
  human: "Run `vendor/bin/psalm --taint-analysis` in the check workflow, or add a Semgrep step."
refs: ["https://fleetlint.org/stacks/#php", "https://psalm.dev/docs/security_analysis/"]
