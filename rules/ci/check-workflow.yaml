id: ci/check-workflow
title: CI runs the check
kind: outcome
severity: warning
scope: root
tiers: [1, 2]
satisfiers:
  - name: task-runner
    expr: >
      workflows().exists(w, ("push" in triggers(w) || "pull_request" in triggers(w))
        && steps(w).exists(s, s.run.matches(r'(^|[\s;&|(\x22\x27])(make|just|task|mise run|npm run|pnpm( run)?|yarn( run)?|bun run|\./gradlew|gradlew|gradle|nix flake)\b[^\n;&|]*\scheck(\s|$|[;&|)\x22\x27])|/check(\.sh)?(\s|$|[;&|)\x22\x27])')))
  - name: dev-container
    expr: >
      workflows().exists(w, ("push" in triggers(w) || "pull_request" in triggers(w))
        && steps(w).exists(s, s.uses.startsWith("devcontainers/ci") && "runCmd" in s.with
          && string(s.with.runCmd).matches(r'(^|[\s;&|(\x22\x27])(make|just|task|mise run|npm run|pnpm( run)?|yarn( run)?|bun run|\./gradlew|gradlew|gradle|nix flake)\b[^\n;&|]*\scheck(\s|$|[;&|)\x22\x27])|/check(\.sh)?(\s|$|[;&|)\x22\x27])')))
message: "no workflow runs the project's check"
requirement: >
  A CI workflow or pipeline that runs on pushes or pull requests (GitLab: branch or merge request
  pipelines) runs the same `check` the hooks run: `make check`, `just check`, `task check`,
  `npm run check`, `./gradlew check` and the like, a `check` script (`./scripts/check.sh`), or the
  same inside the dev container (devcontainers/ci `runCmd`). `check-fast` does not count. A repository
  whose check has another name adds it with `accept:`.
rationale: CI is the record that main was green; it must run the same gate as local, not a different subset.
fix:
  human: "Add a check workflow for the stack; `fleetlint fix --apply` writes the template for the repository's task runner and container setting."
  agent: "Add .github/workflows/check.yml from the stack template (toolchain setup, shared tools, the task runner's check), or a GitLab job running the task runner's check."
  actions:
    - template: "{stack}/check.yml"
      to: .github/workflows/check.yml
refs: ["https://fleetlint.org/baseline/#continuous-integration"]
