id: ci/least-privilege
title: Workflows declare minimal permissions
kind: expr
severity: warning
scope: root
tiers: [1, 2]
when: workflows().exists(w, ci_kind(w) in ["github", "gitea"])
foreach: workflows().filter(w, ci_kind(w) in ["github", "gitea"])
expr: >
  type(yaml(item)) == map
  && ("permissions" in yaml(item)
      || ("jobs" in yaml(item) && type(yaml(item).jobs) == map && yaml(item).jobs.size() > 0
          && yaml(item).jobs.all(k, type(yaml(item).jobs[k]) == map && "permissions" in yaml(item).jobs[k])))
  && !("permissions" in yaml(item) && yaml(item).permissions == "write-all")
  && jobs(item).all(j, j.permissions != "write-all")
message: "workflow does not declare permissions, or grants write-all"
requirement: >
  Every GitHub and Gitea workflow sets top-level `permissions` (normally `contents: read`), or every
  job sets its own, and escalates per job only; `write-all` is never used. GitLab CI has no
  equivalent in the file, and Forgejo workflows are not checked.
rationale: The default token has write access to the repo; a compromised action in a read-only workflow can do far less.
fix:
  human: "Add `permissions: { contents: read }` at the top of each workflow and widen per job."
  agent: "Add top-level `permissions: { contents: read }` to every workflow lacking it; move any wider permission to the job that needs it and replace write-all with the scopes actually used."
refs: ["https://fleetlint.org/baseline/#security"]
