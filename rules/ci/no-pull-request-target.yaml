id: ci/no-pull-request-target
title: pull_request_target never runs untrusted code
kind: expr
severity: error
scope: root
when: repo.public && workflows().exists(w, ci_kind(w) != "gitlab" && "pull_request_target" in triggers(w))
foreach: workflows().filter(w, ci_kind(w) != "gitlab" && "pull_request_target" in triggers(w))
expr: >
  !steps(item).exists(s,
    (s.uses.matches("(^|/)actions/checkout@")
      && (("ref" in s.with && string(s.with.ref).matches("head\\.(sha|ref)|head_ref|pull_request|refs/pull/|event\\.number|issue\\.number"))
        || ("repository" in s.with && string(s.with.repository).matches("head\\.repo|pull_request"))))
    || s.run.matches("\\bgh pr checkout\\b|\\bgit (fetch|pull|checkout|switch)\\b[^\\n]*(\\bpull/|head\\.(sha|ref)|head_ref|\\bFETCH_HEAD\\b)"))
message: "pull_request_target workflow checks out the pull request head"
requirement: >
  A `pull_request_target` workflow runs with repository secrets and never checks out or fetches the
  PR's code: no actions/checkout of the head ref, SHA, `refs/pull/<n>/merge` or the fork repository,
  and no `gh pr checkout` or `git fetch … pull/…` in a run step.
rationale: This is the canonical workflow injection, used in real supply-chain attacks.
fix:
  human: "Use `pull_request` for anything that builds the PR; keep pull_request_target for labelling only."
  agent: "Change the trigger to pull_request, or remove the checkout or fetch of the PR head from the pull_request_target workflow."
refs: ["https://fleetlint.org/baseline/#security"]
