id: ci/sast
title: Code is scanned by a SAST tool
kind: capability
severity: info
scope: root
tiers: [1]
message: "no SAST scan (CodeQL, Semgrep, GitLab SAST, SonarQube) runs on the code"
requirement: >
  A static application security test runs in CI or the task runner: a stack-neutral scanner (CodeQL,
  Semgrep or Opengrep, GitLab SAST, SonarQube) or the stack's own taint analysis (Brakeman for Rails,
  Psalm's taint analysis for PHP). Linters with security rules count under the lint rules, not here. CodeQL default setup, which leaves no file in the
  repository, and other scanners are declared with `accept:`.
rationale: SAST follows data from input to dangerous sinks across files, which per-file linters do not; on GitHub CodeQL is free for public repositories.
fix:
  human: "Add a CodeQL workflow (GitHub advanced setup), include the GitLab SAST component, or add a Semgrep step to CI; with CodeQL default setup, declare it with `accept:`."
  agent: "Add a CodeQL workflow (github/codeql-action init/analyze, pinned) for the repository's languages, or on GitLab include `components/sast`; run it on pull requests and weekly."
refs: ["https://fleetlint.org/baseline/#security"]
