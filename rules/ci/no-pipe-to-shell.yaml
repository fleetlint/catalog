id: ci/no-pipe-to-shell
title: Downloads are not piped into a shell
kind: expr
severity: warning
scope: root
tiers: [1, 2]
when: >
  workflows().size() > 0
  || tracked().exists(p, p.matches("(^|/)((Dockerfile|Containerfile)[^/]*|[^/]+\\.(Dockerfile|Containerfile|dockerfile|containerfile))$"))
foreach: >
  [r'((?:curl|wget)\b[^|#\n]*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:ba|z|da|k)?sh\b|(?:ba|z|da|k)?sh\s+(?:-c\s+)?["\x27]?(?:<\(|\$\()\s*(?:curl|wget)\b)'].map(re,
    workflows().map(w, grep(w, re)).flatten()
    + grep("Dockerfile*", re) + grep("Containerfile*", re)
    + grep("*.Dockerfile", re) + grep("*.Containerfile", re)
    + grep("*.dockerfile", re) + grep("*.containerfile", re)).flatten()
expr: item.text.startsWith("#") || item.path.endsWith(".dockerignore") || item.path.endsWith(".containerignore")
message: "a downloaded script is piped straight into a shell"
requirement: >
  CI scripts (Actions run steps, GitLab scripts) and Dockerfile/Containerfile instructions never pipe a
  download into a shell (`curl ... | sh`, `wget -O- ... | bash`, `sh -c "$(curl ...)"`, `bash <(curl ...)`).
  Tools come from a pinned action, a package manager or a downloaded file whose checksum is verified
  before it runs.
rationale: Whatever the server returns at that moment runs with the job's secrets or ends up in the image, with nothing pinned and nothing verified.
fix:
  human: "Download the installer or release archive to a file, verify its sha256 against a pinned value, then run it; or install through a pinned action or the package manager."
  agent: "Replace each flagged pipe with: download to a file, `sha256sum -c` against a pinned checksum (Renovate-annotated), then execute or extract; keep the installed version unchanged."
refs:
  - {url: "https://github.com/ossf/scorecard/blob/main/docs/checks.md", kind: standard, section: "Pinned-Dependencies"}
  - {url: "https://fleetlint.org/baseline/#security", kind: convention}
