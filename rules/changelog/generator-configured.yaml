id: changelog/generator-configured
title: Changelog generation is configured
kind: capability
# One changelog per repository: the generator of any stack counts.
combine: any
severity: info
scope: root
tiers: [1]
message: "no changelog generator configured"
requirement: >
  The changelog is generated from the commit history, then edited: a stack-neutral generator
  (git-cliff, GoReleaser, release-please, cocogitto, semantic-release, commitizen) or the stack's
  own (changesets for npm, towncrier for Python), configured in its own file or in the manifest.
rationale: Hand-written changelogs drift from the commits; generated ones can be trusted and edited.
fix:
  human: "Add cliff.toml; `fleetlint fix --apply` writes the template."
  agent: "Add cliff.toml for git-cliff with Conventional Commits groups; `fleetlint fix --apply` writes the template."
  actions:
    - template: cliff.toml
refs: ["https://fleetlint.org/baseline/#releases"]
