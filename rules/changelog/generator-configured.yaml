id: changelog/generator-configured
title: Changelog generation is configured
kind: outcome
severity: info
scope: root
tiers: [1]
satisfiers:
  - name: git-cliff
    expr: >
      file("cliff.toml") || file(".cliff.toml")
      || (file("pyproject.toml") && type(toml("pyproject.toml")) == map && "tool" in toml("pyproject.toml")
          && type(toml("pyproject.toml").tool) == map && "git-cliff" in toml("pyproject.toml").tool)
      || (file("Cargo.toml") && text("Cargo.toml").matches("\\[(workspace|package)\\.metadata\\.git-cliff"))
  - name: goreleaser
    expr: >
      [".goreleaser.yaml", ".goreleaser.yml"].exists(f, file(f) && !(type(yaml(f)) == map && "changelog" in yaml(f)
        && type(yaml(f).changelog) == map && "disable" in yaml(f).changelog && yaml(f).changelog.disable == true))
  - name: release-please
    expr: file("release-please-config.json") || file(".release-please-manifest.json")
  - name: changesets
    expr: file(".changeset/config.json")
  - name: cocogitto
    expr: file("cog.toml")
  - name: semantic-release
    expr: >
      [".releaserc", ".releaserc.json", ".releaserc.yaml", ".releaserc.yml", ".releaserc.js", ".releaserc.cjs", ".releaserc.mjs",
       "release.config.js", "release.config.cjs", "release.config.mjs"].exists(f, file(f))
      || (file("package.json") && type(json("package.json")) == map && "release" in json("package.json"))
  - name: commitizen
    expr: >
      file(".cz.toml") || file("cz.toml") || file(".cz.json") || file("cz.json")
      || (file("pyproject.toml") && type(toml("pyproject.toml")) == map && "tool" in toml("pyproject.toml")
          && type(toml("pyproject.toml").tool) == map && "commitizen" in toml("pyproject.toml").tool)
message: "no changelog generator configured"
requirement: >
  The changelog is generated from the commit history, then edited: git-cliff (`cliff.toml`,
  `.cliff.toml`, `[tool.git-cliff]`, Cargo metadata), GoReleaser (its changelog is on unless
  `changelog.disable`), release-please, changesets, cocogitto, semantic-release or commitizen.
rationale: Hand-written changelogs drift from the commits; generated ones can be trusted and edited.
fix:
  human: "Add cliff.toml; `fleetlint fix --apply` writes the template."
  agent: "Add cliff.toml for git-cliff with Conventional Commits groups; `fleetlint fix --apply` writes the template."
  actions:
    - template: cliff.toml
refs: ["https://fleetlint.org/baseline/#releases"]
