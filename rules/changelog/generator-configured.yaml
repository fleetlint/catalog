id: changelog/generator-configured
title: Changelog generation is configured
kind: outcome
# One changelog per repository: any stack's generator counts, so the satisfiers are the union.
severity: info
scope: root
tiers: [1]
locate: cliff.toml
satisfiers:
  - name: git-cliff
    expr: file("cliff.toml") || file(".cliff.toml")
  - name: goreleaser
    expr: >
      [".goreleaser.yaml", ".goreleaser.yml"].exists(f, file(f) && !(type(yaml(f)) == map && "changelog" in yaml(f)
        && type(yaml(f).changelog) == map && "disable" in yaml(f).changelog && yaml(f).changelog.disable == true))
  - name: release-please
    expr: file("release-please-config.json") || file(".release-please-manifest.json")
  - name: cocogitto
    expr: file("cog.toml")
  - name: semantic-release
    expr: >
      [".releaserc", ".releaserc.json", ".releaserc.yaml", ".releaserc.yml", ".releaserc.js", ".releaserc.cjs", ".releaserc.mjs",
       "release.config.js", "release.config.cjs", "release.config.mjs"].exists(f, file(f))
      || (file("package.json") && type(json("package.json")) == map && "release" in json("package.json"))
  - name: commitizen
    expr: file(".cz.toml") || file("cz.toml") || file(".cz.json") || file("cz.json")
  - name: changesets
    expr: file(".changeset/config.json")
  - name: pyproject-tool
    expr: >
      file("pyproject.toml") && type(toml("pyproject.toml")) == map && "tool" in toml("pyproject.toml")
      && type(toml("pyproject.toml").tool) == map
      && ["git-cliff", "commitizen", "towncrier"].exists(t, t in toml("pyproject.toml").tool)
  - name: towncrier
    expr: file("towncrier.toml") || file("changelog.d/towncrier_template.md.jinja")
  - name: cargo-metadata
    expr: file("Cargo.toml") && text("Cargo.toml").matches("\\[(workspace|package)\\.metadata\\.git-cliff")
message: "no changelog generator configured"
requirement: >
  The changelog is generated from the commit history, then edited: a stack-neutral generator
  (git-cliff in `cliff.toml`, `.cliff.toml`, `[tool.git-cliff]` or `[workspace.metadata.git-cliff]`;
  GoReleaser, whose changelog is on unless `changelog.disable`; release-please; cocogitto; semantic-release
  in `.releaserc*`, `release.config.*` or package.json `release`; commitizen) or the stack's own
  (changesets for npm, towncrier for Python), configured in its own file or in the manifest.
rationale: Hand-written changelogs drift from the commits; generated ones can be trusted and edited.
fix:
  human: "Add cliff.toml; `fleetlint fix --apply` writes the template."
  agent: "Add cliff.toml for git-cliff with Conventional Commits groups; `fleetlint fix --apply` writes the template."
  actions:
    - template: cliff.toml
refs:
  - {url: "https://www.conventionalcommits.org/en/v1.0.0/", kind: standard, section: "Why Use Conventional Commits"}
  - {url: "https://keepachangelog.com/en/1.1.0/", kind: standard, section: "How do I make a good changelog?"}
  - {url: "https://git-cliff.org/docs/configuration", kind: spec}
  - {url: "https://github.com/changesets/changesets", kind: spec}
  - {url: "https://towncrier.readthedocs.io/en/stable/", kind: spec}
  - "https://fleetlint.org/baseline/#releases"
