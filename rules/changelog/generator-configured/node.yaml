id: changelog/generator-configured/node
kind: outcome
satisfiers:
  - name: changesets
    expr: file(".changeset/config.json")
  - name: semantic-release-manifest
    expr: file("package.json") && type(json("package.json")) == map && "release" in json("package.json")
requirement: "changesets (`.changeset/config.json`) or semantic-release configured in package.json `release`; or a stack-neutral generator."
fix:
  human: "Add changesets (`npx changeset init`) or cliff.toml."
  actions:
    - template: cliff.toml
refs:
  - {url: "https://github.com/changesets/changesets", kind: spec}
  - {url: "https://semantic-release.gitbook.io/semantic-release", kind: spec}
  - "https://fleetlint.org/stacks/#nodejs--typescript"
