id: changelog/generator-configured/rust
kind: outcome
satisfiers:
  - name: cargo-metadata
    expr: file("Cargo.toml") && text("Cargo.toml").matches("\\[(workspace|package)\\.metadata\\.git-cliff")
requirement: "git-cliff configured in Cargo.toml (`[workspace.metadata.git-cliff]` or `[package.metadata.git-cliff]`); or a stack-neutral generator."
fix:
  human: "Add cliff.toml, or `[workspace.metadata.git-cliff]` to Cargo.toml."
  actions:
    - template: cliff.toml
refs:
  - {url: "https://git-cliff.org/docs/configuration", kind: spec}
  - "https://fleetlint.org/stacks/#rust"
