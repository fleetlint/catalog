id: types/strict/node
kind: expr
title: tsconfig enables the strict compiler flags
# A tsconfig that extends a package other than @tsconfig/strictest cannot be read here.
when: >
  file("tsconfig.json") && [json("tsconfig.json")].exists(t, t != null
    && (!has(t.extends) || (type(t.extends) == list ? t.extends : dyn([t.extends]))
      .all(e, e.startsWith(".") || e.startsWith("@tsconfig/strictest"))))
params:
  required: [strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, noFallthroughCasesInSwitch]
foreach: params.required
# The flag set in tsconfig.json wins; otherwise a local base it extends sets it, or @tsconfig/strictest does.
expr: >
  [json("tsconfig.json")].exists(t,
    (has(t.compilerOptions) && t.compilerOptions != null && item in t.compilerOptions)
      ? t.compilerOptions[item] == true
      : has(t.extends) && (type(t.extends) == list ? t.extends : dyn([t.extends])).exists(e,
          e.startsWith("@tsconfig/strictest")
          || (e.startsWith(".") && [e.endsWith(".json") ? e : e + ".json"].exists(p, file(p)
            && [json(p)].exists(b, b != null && has(b.compilerOptions) && b.compilerOptions != null
              && item in b.compilerOptions && b.compilerOptions[item] == true)))))
message: "strict compiler flag is not enabled"
requirement: "tsconfig.json sets every flag in `params.required` to true, directly, through a local base configuration it extends (one level), or by extending @tsconfig/strictest. A tsconfig that extends another package is not checked."
rationale: "`strict` alone leaves indexed access, optional properties and switch fallthrough unchecked; these flags close the gaps that produce undefined at run time."
fix:
  human: "Set the missing flags to true under compilerOptions (`fleetlint fix --apply` merges them into a tsconfig.json without comments)."
  agent: "Set each reported flag to true in tsconfig.json compilerOptions, run tsc --noEmit and list the errors that appear instead of silencing them."
  actions:
    - merge: {file: tsconfig.json, template: node/tsconfig-strict.json}
refs: ["https://fleetlint.org/stacks/#nodejs--typescript"]
