id: taskrunner/check-composition
title: check runs the gates and excludes bench and release
kind: expr
severity: warning
scope: root
when: taskrunner.kind in ["make", "just", "task"] && "check" in taskrunner.targets
expr: >
  [("check" in taskrunner.deps ? taskrunner.deps["check"] : []) + ("check" in taskrunner.recipes
      ? taskrunner.targets.filter(t, taskrunner.recipes["check"].exists(l,
          l.matches("(\\$\\(MAKE\\)|\\$\\{MAKE\\}|\\bmake\\b|\\bjust\\b|\\btask\\b)[^;&|]*\\s" + t + "(\\s|$)")))
      : [])].exists(d1,
    [d1 + d1.map(d, d in taskrunner.deps ? taskrunner.deps[d] : []).flatten()].exists(d2,
      [d2 + d2.map(d, d in taskrunner.deps ? taskrunner.deps[d] : []).flatten()].exists(all,
        ["lint", "test"].all(t, t in all) && !("bench" in all) && !("release" in all))))
message: "`check` must reach lint and test and must not include bench or release"
requirement: >
  `check` runs lint and test, as prerequisites, through targets it depends on (up to three levels) or
  by invoking them in its recipe (`$(MAKE) lint test`, `just lint`), and never bench or release.
  Cover, audit and build belong in it too, but are not checked here.
rationale: "`check` is the definition of green. A `check` that is slow or flaky gets bypassed, and a bypassed gate is worse than none; benchmarks are noisy and release is a deliberate act."
fix:
  human: "Make `check` depend on lint, test, cover, audit and build, and move bench/release out."
  agent: "Rewrite the check target's prerequisites to `lint test cover audit build`; keep bench and release as separate targets."
refs: ["https://fleetlint.org/baseline/#task-runner-contract"]
