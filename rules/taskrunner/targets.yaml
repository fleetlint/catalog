id: taskrunner/targets
title: Task runner exposes the contract targets
kind: expr
severity: error
tiers: [1, 2]
scope: root
when: taskrunner.kind != "gradle"
params:
  required: [fmt, lint, test, cover, audit, check, check-fast]
foreach: params.required
expr: >
  item in taskrunner.targets
  && !(item in taskrunner.recipes && taskrunner.recipes[item].size() > 0
       && taskrunner.recipes[item].all(l, l.matches("(?i)echo\\s+\"?todo")))
message: "contract target is missing or still a TODO placeholder"
requirement: >
  The task runner exposes fmt, lint, test, cover, audit, check and check-fast (`params.required`), so every
  tool and person can run the same commands in every repository. Any runner counts: a Makefile, a
  justfile, a Taskfile or package.json scripts; with Gradle the built-in `check` task is accepted.
  `facts.taskrunner` names the runner when a repository has more than one.
rationale: "Hooks, CI and automation all depend on `check` meaning the same thing everywhere."
fix:
  human: "Add the missing targets; `fleetlint fix --apply` writes a template for the runner (a Makefile unless `facts.taskrunner` says just or task) when there is none."
  agent: "Add the missing targets to the task runner following its template. Fill each with the stack's real command, no TODO placeholders in check-fast or check."
  actions:
    - template: "{taskrunner}"
refs: ["https://fleetlint.org/baseline/#task-runner-contract"]
