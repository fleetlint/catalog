id: taskrunner/container
title: The task runner uses the container
kind: outcome
severity: warning
scope: root
tiers: [1, 2]
when: repo.container != "none" && taskrunner.kind in ["make", "just", "task"]
satisfiers:
  - name: devcontainer-cli
    expr: text(taskrunner.file).matches("devcontainer (exec|up)")
  - name: docker
    expr: text(taskrunner.file).matches("\\bdocker(-compose)?\\b[^\\n|;&]*\\b(run|exec)\\b")
  - name: podman
    expr: text(taskrunner.file).matches("\\bpodman(-compose)?\\b[^\\n|;&]*\\b(run|exec)\\b")
  - name: other-engine
    expr: text(taskrunner.file).matches("\\b(nerdctl|toolbox|distrobox)\\b[^\\n|;&]*\\b(run|exec|enter)\\b")
message: "the repository is set to run in a container but the task runner runs on the machine"
requirement: >
  When `facts.container` is devcontainer (the default once a devcontainer.json exists), docker or podman, a
  target called outside the container runs inside it, so results do not depend on what is installed on the
  machine. Any way of getting there counts: the devcontainer CLI, `docker run` or `docker compose exec`,
  podman; another one is added with `accept:`. A switch (`CONTAINER=0`) keeps running on the machine
  possible, and `facts.container: none` says the repository runs there.
rationale: A container that the gates do not use is a second environment next to the real one, and the two drift apart.
fix:
  human: "Forward the targets into the container when the runner is called outside it (`fleetlint fix` writes such a runner file when there is none), or set `facts.container: none`."
  agent: "At the top of the task runner file add a CONTAINER switch defaulting to 1 and, when it is 1 and IN_CONTAINER is unset, run each target inside the container (devcontainer exec, docker run or podman run); keep the existing recipes for the other case. Set IN_CONTAINER=1 inside the container."
  actions:
    - template: "{taskrunner}"
refs: ["https://fleetlint.org/baseline/#task-runner-contract"]
