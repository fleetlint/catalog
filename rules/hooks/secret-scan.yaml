id: hooks/secret-scan
title: Hooks scan for secrets
kind: expr
severity: error
scope: root
tiers: [1, 2]
when: file(".pre-commit-config.yaml")
expr: >
  yaml(".pre-commit-config.yaml").repos.exists(r,
    r.repo.contains("gitleaks") ||
    (has(r.hooks) && r.hooks.exists(h, h.id in ["gitleaks", "detect-private-key", "detect-secrets"])))
message: "no secret-scanning hook (gitleaks or detect-private-key) in .pre-commit-config.yaml"
requirement: A pre-commit hook blocks commits containing secrets.
rationale: Secrets must be stopped before they enter history; removing them afterwards means rotation and rewrites.
fix:
  human: "Add the gitleaks hook (repo: https://github.com/gitleaks/gitleaks) to .pre-commit-config.yaml."
  agent: "Add the gitleaks pre-commit hook to .pre-commit-config.yaml and run `prek update`."
