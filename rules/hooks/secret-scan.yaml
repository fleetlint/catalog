id: hooks/secret-scan
title: Hooks scan for secrets
kind: outcome
severity: error
scope: root
tiers: [1, 2]
when: >
  [".pre-commit-config.yaml", "lefthook.yml", "lefthook.yaml", "lefthook.toml", "lefthook.json", "lefthook.jsonc",
   ".lefthook.yml", ".lefthook.yaml", ".lefthook.toml", ".lefthook.json", ".lefthook.jsonc"].exists(f, file(f))
satisfiers:
  - name: pre-commit
    when: file(".pre-commit-config.yaml")
    expr: >
      type(yaml(".pre-commit-config.yaml")) == map && "repos" in yaml(".pre-commit-config.yaml")
      && yaml(".pre-commit-config.yaml").repos.exists(r, type(r) == map && (
        ("repo" in r && string(r.repo).matches("(?i)(gitleaks|trufflehog|ggshield|detect-secrets|secretlint)"))
        || ("hooks" in r && type(r.hooks) == list && r.hooks.exists(h, type(h) == map && (
          ("id" in h && string(h.id).matches("^(gitleaks.*|trufflehog.*|ggshield.*|detect-secrets|secretlint)$"))
          || ("entry" in h && string(h.entry).matches("\\b(gitleaks|trufflehog|ggshield|detect-secrets|secretlint)\\b")))))))
  - name: lefthook
    expr: >
      ["lefthook.yml", "lefthook.yaml", "lefthook.toml", "lefthook.json", "lefthook.jsonc",
       ".lefthook.yml", ".lefthook.yaml", ".lefthook.toml", ".lefthook.json", ".lefthook.jsonc"].filter(f, file(f)).exists(f,
        [dyn(f.endsWith(".toml") ? toml(f) : (f.endsWith(".json") || f.endsWith(".jsonc")) ? json(f) : yaml(f))].exists(d,
          type(d) == map && "pre-commit" in d && type(d["pre-commit"]) == map && [dyn(d["pre-commit"])].exists(h,
            ("commands" in h && type(h.commands) == map && h.commands.exists(k, type(h.commands[k]) == map && "run" in h.commands[k]
              && string(h.commands[k].run).matches("\\b(gitleaks|trufflehog|ggshield|detect-secrets|secretlint)\\b")))
            || ("jobs" in h && type(h.jobs) == list && h.jobs.exists(j, type(j) == map && "run" in j
              && string(j.run).matches("\\b(gitleaks|trufflehog|ggshield|detect-secrets|secretlint)\\b")))
            || ("scripts" in h && type(h.scripts) == map && h.scripts.exists(k, k.matches("(gitleaks|trufflehog|ggshield|detect-secrets|secretlint)"))))))
partials:
  - name: private-keys-only
    severity: warning
    expr: >
      file(".pre-commit-config.yaml") && type(yaml(".pre-commit-config.yaml")) == map && "repos" in yaml(".pre-commit-config.yaml")
      && yaml(".pre-commit-config.yaml").repos.exists(r, type(r) == map && "hooks" in r && type(r.hooks) == list
        && r.hooks.exists(h, type(h) == map && "id" in h && h.id == "detect-private-key"))
    message: "only detect-private-key runs: tokens, passwords and API keys are not scanned"
message: "no secret-scanning hook (gitleaks, trufflehog, ggshield, detect-secrets or secretlint)"
requirement: >
  A pre-commit hook (pre-commit/prek or lefthook's `pre-commit`) runs a secret scanner that blocks
  commits containing secrets: gitleaks, trufflehog, ggshield, detect-secrets or secretlint.
  `detect-private-key` alone finds only private key blocks and counts as a partial result (warning).
rationale: Secrets must be stopped before they enter history; removing them afterwards means rotation and rewrites.
fix:
  human: "Add the gitleaks hook (repo: https://github.com/gitleaks/gitleaks) to .pre-commit-config.yaml, or `gitleaks git --pre-commit --staged` to lefthook's pre-commit."
  agent: "Add the gitleaks pre-commit hook to .pre-commit-config.yaml and run `prek update`; with lefthook add a pre-commit command running `gitleaks git --pre-commit --redact --staged --verbose`."
refs: ["https://fleetlint.org/baseline/#git-hooks", "https://fleetlint.org/baseline/#security"]
