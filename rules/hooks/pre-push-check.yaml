id: hooks/pre-push-check
title: Full check runs before push
kind: outcome
severity: warning
scope: root
tiers: [1, 2]
when: >
  [".pre-commit-config.yaml", "lefthook.yml", "lefthook.yaml", "lefthook.toml", "lefthook.json", "lefthook.jsonc",
   ".lefthook.yml", ".lefthook.yaml", ".lefthook.toml", ".lefthook.json", ".lefthook.jsonc"].exists(f, file(f))
satisfiers:
  - name: pre-commit
    when: file(".pre-commit-config.yaml")
    expr: >
      type(yaml(".pre-commit-config.yaml")) == map && "repos" in yaml(".pre-commit-config.yaml")
      && yaml(".pre-commit-config.yaml").repos.exists(r, type(r) == map && "hooks" in r && type(r.hooks) == list
        && r.hooks.exists(h, type(h) == map && "stages" in h && type(h.stages) == list
          && ("pre-push" in h.stages || "push" in h.stages) && "entry" in h
          && string(h.entry).matches(r'(^|[\s;&|(\x22\x27])(make|just|task|mise run|npm run|pnpm( run)?|yarn( run)?|bun run|\./gradlew|gradlew|gradle|nix flake)\b[^\n;&|]*\scheck(\s|$|[;&|)\x22\x27])|/check(\.sh)?(\s|$|[;&|)\x22\x27])')))
  - name: lefthook
    expr: >
      ["lefthook.yml", "lefthook.yaml", "lefthook.toml", "lefthook.json", "lefthook.jsonc",
       ".lefthook.yml", ".lefthook.yaml", ".lefthook.toml", ".lefthook.json", ".lefthook.jsonc"].filter(f, file(f)).exists(f,
        [dyn(f.endsWith(".toml") ? toml(f) : (f.endsWith(".json") || f.endsWith(".jsonc")) ? json(f) : yaml(f))].exists(d,
          type(d) == map && "pre-push" in d && type(d["pre-push"]) == map && [dyn(d["pre-push"])].exists(h,
            ("commands" in h && type(h.commands) == map && h.commands.exists(k, type(h.commands[k]) == map && "run" in h.commands[k]
              && string(h.commands[k].run).matches(r'(^|[\s;&|(\x22\x27])(make|just|task|mise run|npm run|pnpm( run)?|yarn( run)?|bun run|\./gradlew|gradlew|gradle|nix flake)\b[^\n;&|]*\scheck(\s|$|[;&|)\x22\x27])|/check(\.sh)?(\s|$|[;&|)\x22\x27])')))
            || ("jobs" in h && type(h.jobs) == list && h.jobs.exists(j, type(j) == map && "run" in j
              && string(j.run).matches(r'(^|[\s;&|(\x22\x27])(make|just|task|mise run|npm run|pnpm( run)?|yarn( run)?|bun run|\./gradlew|gradlew|gradle|nix flake)\b[^\n;&|]*\scheck(\s|$|[;&|)\x22\x27])|/check(\.sh)?(\s|$|[;&|)\x22\x27])'))))))
message: "no pre-push hook runs the full check"
requirement: >
  The task runner's `check` (`make check`, `just check`, `task check`, `npm run check`, `./gradlew check`
  and the like) or a `check` script (`./scripts/check.sh`) runs as a pre-push hook: a pre-commit/prek
  hook with `stages: [pre-push]`, or a command in lefthook's `pre-push`. `check-fast` does not count.
rationale: Pushing red is what breaks main for everyone else; the hook makes it impossible to do by accident.
fix:
  human: "Add a local hook whose entry is the task runner's check (`make check`, `just check`, `npm run check`, ...), with stages: [pre-push] and always_run: true."
  agent: "Add a `repo: local` hook running the repository's task runner check (the command `fleetlint check` reports as the task runner, e.g. `just check`) at stage pre-push with pass_filenames: false and always_run: true."
refs:
  - {url: "https://fleetlint.org/baseline/#git-hooks", kind: convention}
  - {url: "https://pre-commit.com/", kind: spec, section: "Confining hooks to run at certain stages"}
