id: deps/install-scripts-disabled
title: Package install scripts are disabled
kind: expr
severity: info
stacks: [node]
tiers: [1, 2]
expr: >
  ["", "../", "../../", "../../../"].exists(d,
    (file(d + ".npmrc") && scan(d + ".npmrc", r'^\s*ignore-scripts\s*=\s*true').size() > 0)
    || (file(d + ".yarnrc.yml") && scan(d + ".yarnrc.yml", r'^\s*enableScripts:\s*false').size() > 0)
    || (file(d + "pnpm-workspace.yaml") && text(d + "pnpm-workspace.yaml").matches(r'onlyBuiltDependencies|allowBuilds'))
    || (file(d + "package.json") && text(d + "package.json").matches(r'onlyBuiltDependencies|trustedDependencies|"packageManager"\s*:\s*"(pnpm@([1-9]\d+)\.|bun@)'))
    || file(d + "bun.lock") || file(d + "bun.lockb"))
message: "dependencies may run install scripts"
requirement: "Install scripts of dependencies do not run by default, set in the project or in a parent directory (for a workspace member, typically the workspace root): `ignore-scripts=true` in .npmrc, `enableScripts: false` in .yarnrc.yml, an explicit allowlist (`onlyBuiltDependencies` for pnpm, `trustedDependencies` for bun), or a package manager that blocks them by default (pnpm 10 or later named in `packageManager`, bun)."
rationale: Install scripts are the usual way a compromised package executes code on developer machines and in CI.
fix:
  human: "Add `ignore-scripts=true` to .npmrc and allow the few packages that need a build step explicitly."
  agent: "Add ignore-scripts=true to .npmrc (or the package manager's equivalent), run a clean install and the tests, and list the packages that need their build script allowed."
refs:
  - {url: "https://docs.npmjs.com/cli/v11/using-npm/config", kind: spec, section: "ignore-scripts"}
  - {url: "https://pnpm.io/settings", kind: spec, section: "Build Settings"}
  - {url: "https://yarnpkg.com/configuration/yarnrc", kind: spec, section: "enableScripts"}
  - {url: "https://bun.sh/docs/install/lifecycle", kind: spec, section: "trustedDependencies"}
  - "https://fleetlint.org/baseline/#dependencies"
  - "https://fleetlint.org/stacks/#nodejs--typescript"
