id: deps/license-check
title: Dependency licenses are checked against an allowlist
kind: capability
severity: info
# Tier 1 only: a license audit matters for what is shipped to others.
tiers: [1]
message: "no license check runs in the task runner or in CI"
requirement: "A task-runner recipe or a CI step checks dependency licenses against an allowlist with the stack's tool or a stack-neutral one (osv-scanner with license scanning, trivy's license scanner, ScanCode, FOSSA, ORT, GitHub dependency review with a license list). Applies at tier 1. Comments, `echo` lines and lines that only install the tool do not count. For a workspace member the repository's CI and the Makefile, justfile or Taskfile of a parent directory count as well. Another checker is added with `accept:`."
rationale: A dependency under an incompatible license is found cheaply before it is merged and expensively after a release.
fix:
  human: "Add the stack's license checker with an allowlist to the `audit` target (see https://fleetlint.org/stacks/)."
  agent: "Add the stack's license checker to the audit target with an allowlist compatible with the repository's own license; report dependencies outside it instead of widening the list."
refs:
  - {url: "https://openchainproject.org/", kind: standard}
  - {url: "https://fleetlint.org/baseline/#dependencies", kind: convention}
