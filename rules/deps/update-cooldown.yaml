id: deps/update-cooldown
title: Fresh releases wait before they are proposed
kind: expr
severity: info
scope: root
tiers: [1, 2]
locate: '(params.renovate.filter(f, file(f)) + [".github/dependabot.yml", ".github/dependabot.yaml"].filter(f, file(f)) + [".github/dependabot.yml"])[0]'
params:
  renovate: ["renovate.json", "renovate.json5", ".renovaterc", ".renovaterc.json", ".renovaterc.json5",
    ".github/renovate.json", ".github/renovate.json5", ".gitea/renovate.json", ".gitea/renovate.json5",
    ".forgejo/renovate.json", ".forgejo/renovate.json5", ".gitlab/renovate.json", ".gitlab/renovate.json5"]
when: >
  params.renovate.exists(f, file(f)) || file(".github/dependabot.yml") || file(".github/dependabot.yaml")
expr: >
  params.renovate.exists(f, file(f) && text(f).matches(r'["\x27]?(minimumReleaseAge|stabilityDays)["\x27]?\s*:'))
  || ["dependabot.yml", "dependabot.yaml"].exists(n, file(".github/" + n)
    && yaml(".github/" + n) != null && "updates" in yaml(".github/" + n) && yaml(".github/" + n).updates.size() > 0
    && yaml(".github/" + n).updates.all(u, "cooldown" in u))
message: "updates are proposed the day a version is published"
requirement: "Update automation waits a few days before proposing a new release: Renovate's `minimumReleaseAge` (or the older `stabilityDays`) is set, or every Dependabot `updates` entry has a `cooldown`."
rationale: Hijacked releases are usually found and pulled within days; a short wait keeps them out of the lockfile.
fix:
  human: "Set `\"minimumReleaseAge\": \"3 days\"` in renovate.json, or `cooldown: {default-days: 3}` on each Dependabot entry."
  agent: "Add minimumReleaseAge (Renovate) or a cooldown per updates entry (Dependabot) of a few days; keep security updates immediate where the tool allows it."
refs:
  - {url: "https://docs.renovatebot.com/configuration-options/", kind: spec, section: "minimumReleaseAge"}
  - {url: "https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference", kind: spec, section: "cooldown"}
  - {url: "https://fleetlint.org/baseline/#dependencies", kind: convention}
