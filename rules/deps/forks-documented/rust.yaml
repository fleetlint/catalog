id: deps/forks-documented/rust
kind: expr
when: grep("Cargo.toml", r'\bgit\s*=\s*"').size() > 0
foreach: grep("Cargo.toml", r'\bgit\s*=\s*"').filter(l, !l.text.matches(r'\s#'))
expr: >
  exists("FORKS.md") || exists("docs/FORKS.md") || exists("docs/forks.md")
  || grep("README.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
  || grep("docs/**/*.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
requirement: "A git source in Cargo.toml (including `[patch]` entries) is documented in FORKS.md or a Forks section, or carries a ` #` comment on the line."
refs:
  - {url: "https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html", kind: spec}
  - {url: "https://doc.rust-lang.org/cargo/reference/overriding-dependencies.html", kind: spec}
  - "https://fleetlint.org/stacks/#rust"
