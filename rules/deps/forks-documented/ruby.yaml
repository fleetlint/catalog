id: deps/forks-documented/ruby
kind: expr
when: grep("Gemfile", r'\b(git|github):\s').size() > 0
foreach: grep("Gemfile", r'\b(git|github):\s').filter(l, !l.text.matches(r'\s#'))
expr: >
  exists("FORKS.md") || exists("docs/FORKS.md") || exists("docs/forks.md")
  || grep("README.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
  || grep("docs/**/*.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
requirement: "A gem taken from `git:` or `github:` in the Gemfile is documented in FORKS.md or a Forks section, or carries a ` #` comment on the line."
refs:
  - {url: "https://guides.rubygems.org/git/", kind: spec}
  - "https://fleetlint.org/stacks/#ruby"
