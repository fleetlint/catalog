id: deps/unused-check/rust
kind: outcome
locate: 'taskrunner.file != "" ? taskrunner.file : "Makefile"'
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: cargo-machete-udeps-shear
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bcargo[- ](machete|udeps|shear)\b') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'\bcargo[- ](machete|udeps|shear)\b') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.uses.startsWith("bnjbvr/cargo-machete")
           || s.run.split("\n").exists(l, l.matches(r'\bcargo[- ](machete|udeps|shear)\b') && !l.matches(params.skip))))
requirement: "A recipe or CI step runs cargo-machete, cargo-shear or cargo-udeps."
fix:
  human: "Run `cargo machete` in the `audit` target."
refs:
  - {url: "https://github.com/bnjbvr/cargo-machete", kind: spec}
  - "https://fleetlint.org/stacks/#rust"
