id: deps/unused-check/python
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
satisfiers:
  - name: deptry
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\b(deptry|fawltydeps)\b') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\b(deptry|fawltydeps)\b') && !l.matches(params.skip))))
requirement: "A recipe or CI step runs deptry (or FawltyDeps)."
fix:
  human: "Run `uvx deptry .` in the `audit` target."
refs: ["https://fleetlint.org/stacks/#python"]
