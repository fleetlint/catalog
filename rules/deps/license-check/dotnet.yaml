id: deps/license-check/dotnet
kind: outcome
locate: 'taskrunner.file != "" ? taskrunner.file : "Makefile"'
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: nuget-license
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\b(nuget-license|dotnet-project-licenses)\b[^;&|]*(-a|--allowed-license-types)\b') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'\b(nuget-license|dotnet-project-licenses)\b[^;&|]*(-a|--allowed-license-types)\b') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\b(nuget-license|dotnet-project-licenses)\b[^;&|]*(-a|--allowed-license-types)\b') && !l.matches(params.skip))))
requirement: "A task-runner recipe or a CI step runs nuget-license (or its predecessor dotnet-project-licenses) with an allowed-licenses file (`-a`/`--allowed-license-types`), or a stack-neutral license checker."
fix:
  human: "Install nuget-license as a local dotnet tool and run `dotnet nuget-license -i x.sln -a allowed-licenses.json` in the `audit` target."
refs:
  - {url: "https://github.com/sensslen/nuget-license", kind: spec}
  - "https://fleetlint.org/stacks/#net"
