id: deps/license-check/php
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: license-checker
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\blicense-checker\s+check\b') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'\blicense-checker\s+check\b') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\blicense-checker\s+check\b') && !l.matches(params.skip))))
requirement: "A task-runner recipe or a CI step runs madewithlove/license-checker (`license-checker check` against .allowed-licenses), or a stack-neutral license checker. `composer licenses` alone only lists licenses and does not count."
fix:
  human: "Add madewithlove/license-checker, generate .allowed-licenses and run `vendor/bin/license-checker check` in the `audit` target."
refs: ["https://fleetlint.org/stacks/#php"]
