id: deps/license-check/java
kind: outcome
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
satisfiers:
  - name: check-license-task
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bcheckLicense\b|\blicense:add-third-party\b[^;&|]*-Dlicense\.(failOnBlacklist|failOnNotWhitelisted|failIfWarning)') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\bcheckLicense\b|\blicense:add-third-party\b[^;&|]*-Dlicense\.(failOnBlacklist|failOnNotWhitelisted|failIfWarning)') && !l.matches(params.skip))))
  - name: build-plugin
    expr: >
      (file("pom.xml") && text("pom.xml").contains("license-maven-plugin")
        && text("pom.xml").matches(r'<(failOnBlacklist|failOnNotWhitelisted|failIfWarning)>\s*true'))
      || glob("**/build.gradle*").exists(f, text(f).contains("allowedLicensesFile")
        && text(f).matches(r'dependsOn\W[^\n]*checkLicense'))
requirement: "pom.xml configures license-maven-plugin to fail on licenses outside its list (`failOnBlacklist`/`failOnNotWhitelisted`), or the Gradle dependency-license-report plugin has an `allowedLicensesFile` and its `checkLicense` task runs (from a recipe, a CI step or a task dependency); or a stack-neutral license checker runs."
fix:
  human: "Gradle: add com.github.jk1.dependency-license-report with allowedLicensesFile and run checkLicense in `audit`; Maven: configure license-maven-plugin with an included-licenses list and failOnBlacklist."
refs: ["https://fleetlint.org/stacks/#java"]
