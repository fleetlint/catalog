id: deps/license-check/java
kind: outcome
locate: '(["pom.xml", "build.gradle.kts", "build.gradle"].filter(f, file(f)) + ["pom.xml"])[0]'
params:
  skip: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b|(sudo\s+)?(go (install|get)|cargo b?install|pipx? install|pip3 install|python3? -m pip install|uv (tool |pip )?(install|add)|(npm|pnpm|yarn|bun) (i|install|add|global add)|gem install|bundle add|brew install|dotnet tool (install|update)|composer (global )?require|apt(-get)? install|curl|wget)\b[^;&]*$)'
  # A member scope also counts its parent directories' task runners.
  runners: ["../Makefile", "../justfile", "../Justfile", "../Taskfile.yml", "../Taskfile.yaml",
    "../../Makefile", "../../justfile", "../../Justfile", "../../Taskfile.yml", "../../Taskfile.yaml",
    "../../../Makefile", "../../../justfile", "../../../Justfile", "../../../Taskfile.yml", "../../../Taskfile.yaml"]
satisfiers:
  - name: check-license-task
    expr: >
      taskrunner.recipes.exists(t, taskrunner.recipes[t].exists(l, l.matches(r'\bcheckLicense\b|\blicense:add-third-party\b[^;&|]*-Dlicense\.(failOnBlacklist|failOnNotWhitelisted|failIfWarning)') && !l.matches(params.skip)))
      || params.runners.exists(f, file(f) && lines(f).exists(l, l.matches(r'\bcheckLicense\b|\blicense:add-third-party\b[^;&|]*-Dlicense\.(failOnBlacklist|failOnNotWhitelisted|failIfWarning)') && !l.matches(params.skip)))
      || workflows().exists(w, steps(w).exists(s, s.run.split("\n").exists(l, l.matches(r'\bcheckLicense\b|\blicense:add-third-party\b[^;&|]*-Dlicense\.(failOnBlacklist|failOnNotWhitelisted|failIfWarning)') && !l.matches(params.skip))))
  - name: build-plugin
    expr: >
      ["", "../", "../../", "../../../"].map(d, d + "pom.xml").exists(p, file(p) && text(p).contains("license-maven-plugin")
        && text(p).matches(r'<(failOnBlacklist|failOnNotWhitelisted|failIfWarning)>\s*true'))
      || (glob("**/build.gradle*") + ["../", "../../", "../../../"].map(d, [d + "build.gradle", d + "build.gradle.kts"]).flatten().filter(f, file(f))).exists(f, text(f).contains("allowedLicensesFile")
        && text(f).matches(r'dependsOn\W[^\n]*checkLicense'))
  # Licensee hooks its task into `check` and fails it on a license outside allow() unless violationAction is LOG or IGNORE.
  - name: licensee
    expr: >
      [glob("**/build.gradle*") + glob("buildSrc/**/*.gradle*") + glob("build-logic/**/*.gradle*")
        + ["../", "../../", "../../../"].map(d, [d + "build.gradle", d + "build.gradle.kts"]).flatten().filter(f, file(f))].exists(fs,
        fs.exists(f, lines(f).exists(l, !l.matches(r'\bapply\s*\(?\s*false\b')
          && (l.matches(r'["\x27]app\.cash\.licensee["\x27]')
            || (l.matches(r'libs\.plugins\.[\w.]*licensee') && ["", "../", "../../", "../../../"].exists(d, file(d + "gradle/libs.versions.toml")
              && text(d + "gradle/libs.versions.toml").contains("app.cash.licensee"))))))
        && !fs.exists(f, text(f).matches(r'violationAction\W[^\n]*\b(LOG|IGNORE)\b')))
requirement: "pom.xml configures license-maven-plugin to fail on licenses outside its list (`failOnBlacklist`/`failOnNotWhitelisted`), or the Gradle dependency-license-report plugin has an `allowedLicensesFile` and its `checkLicense` task runs (from a recipe, a CI step or a task dependency), or the Licensee plugin (`app.cash.licensee`) is applied, which fails `check` on a license outside its `allow` list unless `violationAction` is LOG or IGNORE; or a stack-neutral license checker runs."
fix:
  human: "Gradle: apply the Licensee plugin (`app.cash.licensee`) with `allow(\"<SPDX id>\")` entries, which `check` runs, or add com.github.jk1.dependency-license-report with allowedLicensesFile and run checkLicense in `audit`; Maven: configure license-maven-plugin with an included-licenses list and failOnBlacklist."
refs:
  - {url: "https://www.mojohaus.org/license-maven-plugin/add-third-party-mojo.html", kind: spec}
  - {url: "https://github.com/jk1/Gradle-License-Report", kind: spec}
  - {url: "https://github.com/cashapp/licensee", kind: spec}
  - "https://fleetlint.org/stacks/#java"
