id: deps/update-coverage
title: Update automation covers every ecosystem
kind: expr
severity: info
scope: root
tiers: [1, 2]
# Renovate runs every manager unless enabledManagers narrows it; Dependabot needs an updates entry per ecosystem.
params:
  renovate: ["renovate.json", "renovate.json5", ".renovaterc", ".renovaterc.json", ".renovaterc.json5",
    ".github/renovate.json", ".github/renovate.json5", ".gitea/renovate.json", ".gitea/renovate.json5",
    ".forgejo/renovate.json", ".forgejo/renovate.json5", ".gitlab/renovate.json", ".gitlab/renovate.json5"]
  dependabot: {go: [gomod], python: [pip, uv], rust: [cargo], node: [npm, bun], java: [maven, gradle], kotlin: [gradle],
    flutter: [pub], dotnet: [nuget], ruby: [bundler], php: [composer], github-actions: [github-actions], docker: [docker, docker-compose]}
  managers: {go: [gomod], python: [pep621, poetry, pip_requirements, pip-compile, pipenv, setup-cfg, pep723], rust: [cargo],
    node: [npm, bun], java: [maven, gradle, maven-wrapper, gradle-wrapper], kotlin: [gradle], flutter: [pub], dotnet: [nuget],
    ruby: [bundler], php: [composer], github-actions: [github-actions], docker: [dockerfile, docker-compose]}
when: >
  params.renovate.exists(f, file(f)) || file(".github/dependabot.yml") || file(".github/dependabot.yaml")
foreach: >
  repo.stacks.filter(s, s in params.dependabot)
  + (exists(".github/workflows/*.y*ml") ? ["github-actions"] : [])
  + (exists("**/Dockerfile") || exists("**/Containerfile") || exists("**/*.Dockerfile") ? ["docker"] : [])
expr: >
  params.renovate.exists(f, file(f)
    && (!text(f).contains("enabledManagers") || params.managers[item].exists(m, text(f).matches(r'enabledManagers[^\]]*["\x27]' + m + r'["\x27]')))
    && !params.managers[item].exists(m, text(f).matches(r'["\x27]?' + m + r'["\x27]?\s*:\s*\{\s*["\x27]?enabled["\x27]?\s*:\s*false')))
  || ["dependabot.yml", "dependabot.yaml"].exists(n, file(".github/" + n)
    && yaml(".github/" + n) != null && "updates" in yaml(".github/" + n)
    && yaml(".github/" + n).updates.exists(u, "package-ecosystem" in u && string(u["package-ecosystem"]) in params.dependabot[item]))
message: "update automation does not cover this ecosystem"
requirement: "The update automation covers every detected stack plus GitHub Actions workflows and Dockerfiles: Renovate does unless `enabledManagers` leaves the ecosystem's manager out or the manager is switched off (`\"<manager>\": {\"enabled\": false}`); Dependabot needs an `updates` entry with the ecosystem's `package-ecosystem`. C/C++ and Hugo have no entry to check."
rationale: An automation that updates the npm packages but not the base image or the actions leaves exactly the parts nobody looks at to rot.
fix:
  human: "Add an `updates` entry per ecosystem to .github/dependabot.yml, or switch to Renovate (config:recommended covers every manager)."
  agent: "Add the missing ecosystems to the Dependabot updates list (or the Renovate enabledManagers list) with the same schedule as the existing entries."
refs:
  - {url: "https://github.com/ossf/scorecard/blob/main/docs/checks.md", kind: standard, section: "Dependency-Update-Tool"}
  - {url: "https://docs.renovatebot.com/configuration-options/", kind: spec, section: "enabledManagers"}
  - {url: "https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference", kind: spec, section: "package-ecosystem"}
  - "https://fleetlint.org/baseline/#dependencies"
