id: deps/locked-install/kotlin
kind: expr
params:
  noise: '^\s*[@+-]*\s*(\{\{[^}]*\}\}\s*|\$[({][A-Za-z_]+[)}]\s*)?(#|//|echo\b|printf\b)'
expr: >
  !(taskrunner.recipes.filter(t, !t.matches(r'(?i)update|upgrade|lock|bump|renovate')).map(t, taskrunner.recipes[t]).flatten()
      + workflows().map(w, steps(w).map(s, s.run.split("\n")).flatten()).flatten())
      .filter(l, !l.matches(params.noise)).exists(l, l.matches(r'--(write|update)-locks\b|--write-verification-metadata\b'))
message: "a Gradle build rewrites its lock state"
requirement: "Gradle checks resolved versions against gradle.lockfile (and artifacts against verification metadata) on every build; this holds unless a recipe or CI step outside an update target passes `--write-locks`, `--update-locks` or `--write-verification-metadata`, which is what is checked."
fix:
  human: "Move lock updates to an `update-locks` target that is not part of CI."
refs:
  - {url: "https://docs.gradle.org/current/userguide/dependency_locking.html", kind: spec, section: "Running a build with lock state present"}
  - {url: "https://docs.gradle.org/current/userguide/dependency_verification.html", kind: spec}
  - "https://fleetlint.org/stacks/#kotlin-jvm--android"
