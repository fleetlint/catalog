id: deps/forks-documented
title: Forked or patched dependencies are documented
kind: expr
severity: info
scope: root
tiers: [1, 2]
# Fork lines: a go.mod replace to another module (local paths are siblings, not forks), a git source in
# Cargo.toml, package.json or a Python requirement; each without an inline comment is reported.
when: >
  grep("go.mod", r'=>\s*[a-z]').size() > 0 || grep("Cargo.toml", r'\bgit\s*=\s*"').size() > 0
  || grep("package.json", r'"(github:|git\+|git://|https://github\.com/[^"]+\.git)').size() > 0
  || grep("pyproject.toml", r'@ ?git\+').size() > 0 || grep("requirements*.txt", r'git\+').size() > 0
foreach: >
  grep("go.mod", r'=>\s*[a-z]').filter(l, !l.text.contains("//"))
  + grep("Cargo.toml", r'\bgit\s*=\s*"').filter(l, !l.text.matches(r'\s#'))
  + grep("package.json", r'"(github:|git\+|git://|https://github\.com/[^"]+\.git)')
  + grep("pyproject.toml", r'@ ?git\+').filter(l, !l.text.matches(r'\s#'))
  + grep("requirements*.txt", r'git\+').filter(l, !l.text.matches(r'\s#'))
expr: >
  exists("FORKS.md") || exists("docs/FORKS.md") || exists("docs/forks.md")
  || grep("README.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
  || grep("docs/**/*.md", r'^#+ .*\b(forks?|vendored|patched|patches)\b').size() > 0
message: "forked or patched dependency is not documented"
requirement: "Every dependency taken from a fork (a go.mod `replace` pointing at another module, a git source in Cargo.toml, package.json or a Python requirement) is documented: upstream, base version, what changed and why. A `FORKS.md` (root or docs/), a `Forks` section in the README or docs, or an inline comment on the line (`//` in go.mod, ` #` elsewhere; package.json has no comments) counts. A replace to a local path (`=> ../x`) is a sibling module, not a fork."
rationale: A fork without a note outlives the reason for it; the next upgrade either drops the fix or keeps the fork forever.
fix:
  human: "Add docs/FORKS.md listing each forked or patched dependency with upstream, base version, the change and why, or comment each line."
  agent: "Document each forked or patched dependency (upstream, base version, change, reason) in docs/FORKS.md; ask the user for the reason where the history does not say."
refs: ["https://fleetlint.org/baseline/#dependencies"]
