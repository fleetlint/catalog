id: deps/forks-documented
title: Forked or patched dependencies are documented
kind: capability
severity: info
scope: root
tiers: [1, 2]
message: "forked or patched dependency is not documented"
requirement: "Every dependency taken from a fork or a git source is documented: upstream, base version, what changed and why. A `FORKS.md` (root or docs/), a `Forks` section in the README or docs, or an inline comment on the line where the manifest has comments counts. Each stack's implementation says which manifest lines are forks."
rationale: A fork without a note outlives the reason for it; the next upgrade either drops the fix or keeps the fork forever.
fix:
  human: "Add docs/FORKS.md listing each forked or patched dependency with upstream, base version, the change and why, or comment each line."
  agent: "Document each forked or patched dependency (upstream, base version, change, reason) in docs/FORKS.md; ask the user for the reason where the history does not say."
refs: ["https://fleetlint.org/baseline/#dependencies"]
