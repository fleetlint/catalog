id: deps/update-automation
title: Dependency updates are automated
kind: expr
severity: warning
scope: root
tiers: [1, 2]
locate: '"renovate.json"'
expr: >
  exists("renovate.json") || exists("renovate.json5") || exists(".renovaterc") || exists(".renovaterc.json") || exists(".renovaterc.json5")
  || [".github", ".gitea", ".forgejo", ".gitlab"].exists(d, file(d + "/renovate.json") || file(d + "/renovate.json5"))
  || (file("package.json") && json("package.json") != null && "renovate" in json("package.json"))
  || file(".github/dependabot.yml") || file(".github/dependabot.yaml")
message: "no Renovate or Dependabot configuration"
requirement: >
  Renovate (preferred, works on GitHub, GitLab, Gitea and Forgejo) or Dependabot keeps dependencies and pinned actions current:
  a Renovate config (`renovate.json`, `renovate.json5`, `.renovaterc*`, or one of those under `.github/`, `.gitea/`,
  `.forgejo/`, `.gitlab/`, or a `renovate` key in package.json) or `.github/dependabot.yml`.
  Tool versions count too: Renovate reads version-manager files (`mise.toml`, `.tool-versions`) directly, hook
  revisions once its pre-commit manager is enabled, and a version in a task runner file or a workflow when a
  `# renovate: datasource=... depName=...` comment sits above a `*_VERSION` variable.
rationale: Unpinned is unsafe and pinned-but-stale is unsafe too; only automation keeps both true.
fix:
  human: "Add renovate.json extending config:recommended with the pinned-actions preset; `fleetlint fix --apply` writes one with only the settings the repository's stacks need."
  agent: "Add renovate.json extending config:recommended and helpers:pinGitHubActionDigests; add gomodTidy only for a Go module and lockfile maintenance only where a package manager keeps a lockfile."
  actions:
    - template: "{stack}/renovate.json"
      to: renovate.json
refs:
  - {url: "https://github.com/ossf/scorecard/blob/main/docs/checks.md", kind: standard, section: "Dependency-Update-Tool"}
  - {url: "https://docs.renovatebot.com/", kind: spec}
  - {url: "https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates", kind: guidance}
  - "https://fleetlint.org/baseline/#dependencies"
