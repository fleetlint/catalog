id: deps/update-automation
title: Dependency updates are automated
kind: expr
severity: warning
scope: root
tiers: [1, 2]
expr: >
  exists("renovate.json*") || exists(".renovaterc*") || exists(".github/renovate.json*")
  || file(".github/dependabot.yml") || file(".gitea/dependabot.yml") || file(".gitlab/renovate.json")
message: "no Renovate or Dependabot configuration"
requirement: >
  Renovate (preferred, works on GitHub and Gitea) or Dependabot keeps dependencies and pinned actions current.
  Tool versions count too: Renovate reads version-manager files (`mise.toml`, `.tool-versions`) directly, hook
  revisions once its pre-commit manager is enabled, and a version in a task runner file or a workflow when a
  `# renovate: datasource=… depName=…` comment sits above a `*_VERSION` variable.
rationale: Unpinned is unsafe and pinned-but-stale is unsafe too; only automation keeps both true.
fix:
  human: "Add renovate.json extending config:recommended with the pinned-actions preset; `fleetlint fix --apply` writes one with only the settings the repository's stacks need."
  agent: "Add renovate.json extending config:recommended and helpers:pinGitHubActionDigests; add gomodTidy only for a Go module and lockfile maintenance only where a package manager keeps a lockfile."
  actions:
    - template: "{stack}/renovate.json"
      to: renovate.json
refs: ["https://fleetlint.org/baseline/#dependencies"]
