id: slop/escape-hatches
title: Lint and type suppressions are reviewed
kind: expr
severity: info
scope: root
foreach: >
  codegrep("nontest", r'@ts-(ignore|nocheck|expect-error)|\bas any\b|:\s*any\s*([,;)=\]>]|$)|#\s*type:\s*ignore|eslint-disable|//\s*nolint|\bNOLINT|#\s*noqa|pylint:\s*disable|pyright:\s*ignore|rubocop:disable|@?phpstan-ignore|@psalm-suppress|@Suppress(Warnings|Lint)?\(|\[SuppressMessage\(|#pragma warning disable|//\s*ignore(_for_file)?:|#!?\[allow\(')
expr: >
  false
message: "lint or type-check suppression"
requirement: "Suppressions are rare and each has a reason next to it: `@ts-ignore`, `@ts-expect-error`, `as any`, `eslint-disable`, `nolint`, `NOLINT`, `noqa`, `type: ignore`, `pylint: disable`, `pyright: ignore`, `rubocop:disable`, `phpstan-ignore`, `@Suppress`, `@SuppressLint`, `[SuppressMessage]`, `#pragma warning disable`, Dart `ignore:` and Rust `#[allow]`. This rule lists them for review; it cannot tell a justified one from an unjustified one."
rationale: "Each suppression switches a check off for good; a list of them is the fastest audit of where the checks do not apply."
fix:
  human: "Fix the code instead of suppressing, or state the reason on the same line."
  agent: "For each suppression, try the fix first; if it stays, add the specific rule name and a one-line reason."
refs:
  - {url: "https://docs.astral.sh/ruff/rules/blanket-type-ignore/", kind: check, section: "PGH003"}
  - {url: "https://docs.astral.sh/ruff/rules/blanket-noqa/", kind: check, section: "PGH004"}
  - {url: "https://typescript-eslint.io/rules/ban-ts-comment/", kind: check, section: "ban-ts-comment"}
  - {url: "https://golangci-lint.run/docs/linters/configuration/", kind: check, section: "nolintlint"}
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#errors-types-and-robustness"
