id: slop/non-conventional-commits
title: Commit subjects in the history follow Conventional Commits
kind: expr
severity: info
scope: root
when: repo.has_git
params:
  commits: 200
foreach: >
  commits(params.commits)
expr: >
  item.subject.matches(r'^(feat|fix|refactor|perf|test|docs|build|chore|revert|ci|style)(\([^)]+\))?!?: ')
  || item.subject.startsWith("Merge ") || item.subject.startsWith("Revert \"") || item.root
message: "commit subject in the history has no Conventional Commits type"
requirement: "Commit subjects in the recent history (`params.commits`, default 200) have the form `type(scope): subject`. Merge commits, git's own `Revert \"...\"` subjects and the root commit are exempt. `hooks/conventional-commits` checks that a hook prevents new ones; this rule reads what is already committed."
rationale: "The changelog and the next version number are computed from the subjects."
fix:
  human: "Install the commit-msg hook so new commits are checked."
  agent: "Use Conventional Commits for new commits. Do not rewrite pushed history without the user's decision."
refs: ["https://fleetlint.org/baseline/#slop", "https://fleetlint.org/slop/#commits-and-history"]
