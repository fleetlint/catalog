id: slop/swallowed-errors
title: Errors are not swallowed
kind: expr
severity: info
scope: root
foreach: >
  codegrep("nontest", r'catch\s*(\([^)]*\))?\s*\{\s*\}|except[^:]*:\s*pass\b|\b_\s*=\s*err\b|\.catch\(\s*\(\)\s*=>\s*(\{\s*\}|null|undefined)\s*\)|catch \(_\)|\brescue\s+nil\b|\brescue(\s+[\w:]+)?(\s*=>\s*\w+)?\s*;\s*end\b')
expr: >
  false
message: "error is caught or assigned and then ignored"
requirement: "No empty catch blocks (JavaScript, Java, Kotlin, C#, PHP, Dart), no `except: pass`, no `_ = err`, no Ruby `rescue nil` or `rescue; end`. Only single-line forms are detected; the stack's linter covers the rest."
rationale: "A swallowed error turns a failure with a cause into a wrong result without one."
fix:
  human: "Handle the error, wrap and return it, or log it where it is handled."
  agent: "Propagate the error with context unless the surrounding code shows it is safe to ignore; then say why in a comment."
refs:
  - {url: "https://go.dev/wiki/CodeReviewComments", kind: guidance, section: "Handle Errors"}
  - {url: "https://docs.astral.sh/ruff/rules/try-except-pass/", kind: check, section: "S110"}
  - {url: "https://eslint.org/docs/latest/rules/no-empty", kind: check, section: "no-empty"}
  - {url: "https://detekt.dev/docs/rules/empty-blocks/", kind: check, section: "EmptyCatchBlock"}
  - {url: "https://docs.rubocop.org/rubocop/latest/cops_lint.html", kind: check, section: "Lint/SuppressedException"}
  - "https://fleetlint.org/baseline/#slop"
  - "https://fleetlint.org/slop/#errors-types-and-robustness"
