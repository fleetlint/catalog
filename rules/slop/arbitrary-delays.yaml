id: slop/arbitrary-delays
title: No sleeps outside tests
kind: expr
severity: info
scope: root
foreach: >
  codegrep("nontest", r'(^|[^.\w:])u?sleep\(|\b(time|Thread)\.[sS]leep\(|\bthread::sleep\(|^\s*sleep\s+[0-9]')
expr: >
  false
message: "blocking sleep outside tests"
requirement: "Non-test code does not block for a fixed time: `sleep(`, `time.sleep(`, `time.Sleep(`, `Thread.sleep(`, `thread::sleep(` or a shell `sleep N`. Asynchronous timers (`setTimeout`, `asyncio.sleep`, coroutine `delay`) are not read."
rationale: "A delay that papers over an ordering problem fails on a slower machine and wastes time on a faster one."
fix:
  human: "Wait for the event or condition itself; keep real backoff and rate limiting with a comment saying so."
  agent: "Report each delay; replace it with waiting on the actual condition where that is evident, and leave deliberate backoff alone."
refs:
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#code-structure"
