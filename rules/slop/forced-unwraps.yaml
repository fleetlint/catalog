id: slop/forced-unwraps
title: No forced unwraps outside tests
kind: expr
severity: info
scope: root
foreach: >
  codegrep("nontest", r'\.unwrap\(\)').filter(m, m.path.endsWith(".rs"))
  + codegrep("nontest", r'[\w)\]]!!').filter(m, m.path.matches(r'\.(kt|kts)$'))
  + codegrep("nontest", r'\btry!\s').filter(m, m.path.endsWith(".swift"))
expr: >
  false
message: "forced unwrap outside tests"
requirement: "Non-test code does not force a value out of an optional or a result: `.unwrap()` in Rust, `!!` in Kotlin, `try!` in Swift. `.expect(\"why\")` states the invariant and is not read. This rule lists them for review."
rationale: "A forced unwrap turns a missing value or an error into a crash with no context, at the place least likely to be tested."
fix:
  human: "Handle the empty or error case, or propagate it (`?` in Rust, `?:`/`requireNotNull` in Kotlin, `try` in Swift)."
  agent: "Propagate the error or handle the empty case; where the value cannot be absent, state the invariant (`.expect(\"...\")` in Rust, `requireNotNull(x) { \"...\" }` in Kotlin)."
refs:
  - {url: "https://rust-lang.github.io/rust-clippy/master/index.html", kind: check, section: "unwrap_used"}
  - {url: "https://detekt.dev/docs/rules/potential-bugs/", kind: check, section: "UnsafeCallOnNullableType"}
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#errors-types-and-robustness"
