id: slop/variant-files
title: No files named as copies or variants
kind: expr
severity: info
scope: root
foreach: >
  tracked().filter(p, p.matches(r'(_|-)(v[2-9]|old|new|backup|copy|fixed|improved|enhanced)\.[a-z]+$|( copy|\([0-9]+\))\.[a-z]+$'))
expr: >
  false
message: "file is named as a copy or variant"
requirement: "No file is named as a variant of another (`client_v2.py`, `handler-old.ts`, `config copy.json`)."
rationale: "The history keeps old versions; a second file means nobody decided which one is current."
fix:
  human: "Keep one file under the original name and delete the other."
  agent: "Report the pair; do not delete either without confirming which is in use."
refs: ["https://fleetlint.org/baseline/#slop"]
