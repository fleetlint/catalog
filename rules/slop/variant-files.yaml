id: slop/variant-files
title: No files named as copies or variants
kind: expr
severity: info
scope: root
foreach: >
  tracked().filter(p,
    p.matches(r'(_|-)(old|backup|copy|fixed|improved|enhanced)\.[a-z]+$|( copy|\([0-9]+\))\.[a-z]+$')
    || (p.matches(r'[_-](v[2-9]|new)\.(go|py|rs|ts|tsx|js|jsx|mjs|cjs|kt|kts|java|dart|swift|rb|php|cs|c|cc|cpp|h|hpp|vue|svelte|scala)$')
        && !p.matches(r'(?i)(^|/)[^/]*(api|openapi|swagger|schema|proto|route|router|routes|endpoint|migration)[^/]*$')
        && (p.substring(0, p.lastIndexOf(".") - (p.matches(r'[_-]new\.[a-z]+$') ? 4 : 3)) + p.substring(p.lastIndexOf("."))) in tracked()))
expr: >
  false
message: "file is named as a copy or variant"
requirement: "No file is named as a copy of another (`handler-old.ts`, `config copy.json`, `notes(1).md`), and no source file is a `_v2` or `_new` variant of a file that is still tracked (`client_v2.py` next to `client.py`). Versioned API, routing, schema and migration files are not read."
rationale: "The history keeps old versions; a second file means nobody decided which one is current."
fix:
  human: "Keep one file under the original name and delete the other."
  agent: "Report the pair; do not delete either without confirming which is in use."
refs:
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#code-structure"
