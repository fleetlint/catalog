id: slop/insecure-patterns
title: No disabled TLS verification or similar shortcuts
kind: expr
severity: warning
scope: root
foreach: >
  codegrep("nontest", r'badCertificateCallback\s*=\s*\([^)]*\)\s*=>\s*true|ServerCertificateCustomValidationCallback\s*=.*=>\s*true|InsecureSkipVerify:\s*true|verify\s*=\s*False|rejectUnauthorized:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|danger_accept_invalid_certs|CURLOPT_SSL_VERIFYPEER,\s*(false|0)\b|VERIFY_NONE\b|(^|[^.\w$])eval\(|chmod\s+(-R\s+)?777|Allow-Origin[\x22\x27]?\s*[:,]\s*[\x22\x27]\*')
expr: >
  false
message: "insecure shortcut"
requirement: "No globally disabled certificate verification (a callback that accepts every certificate, `InsecureSkipVerify`, `verify=False`, `rejectUnauthorized: false`, `VERIFY_NONE`), bare `eval(`, `chmod 777` or wildcard CORS origin in non-test code. Method calls named `eval` (`model.eval()`, `redis.eval(`) and certificate callbacks that check the certificate are not findings."
rationale: "Each one was added to make something work once and removes a protection for every user afterwards."
fix:
  human: "Scope the exception to one host or one path with explicit opt-in, or remove it."
  agent: "Report each occurrence with what it disables; replace only when the secure equivalent is evident."
refs:
  - {url: "https://cwe.mitre.org/data/definitions/295.html", kind: standard, section: "CWE-295: Improper Certificate Validation"}
  - {url: "https://github.com/securego/gosec", kind: check, section: "G402"}
  - {url: "https://bandit.readthedocs.io/en/latest/plugins/b501_request_with_no_cert_validation.html", kind: check, section: "B501"}
  - {url: "https://docs.astral.sh/ruff/rules/suspicious-eval-usage/", kind: check, section: "S307"}
  - {url: "https://docs.astral.sh/ruff/rules/bad-file-permissions/", kind: check, section: "S103"}
  - "https://fleetlint.org/baseline/#slop"
  - "https://fleetlint.org/slop/#errors-types-and-robustness"
