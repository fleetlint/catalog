id: slop/insecure-patterns
title: No disabled TLS verification or similar shortcuts
kind: expr
severity: warning
scope: root
foreach: >
  codegrep("nontest", r'badCertificateCallback|InsecureSkipVerify:\s*true|verify\s*=\s*False|rejectUnauthorized:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|danger_accept_invalid_certs|\beval\(|chmod\s+(-R\s+)?777|Allow-Origin[\x22\x27]?\s*[:,]\s*[\x22\x27]\*')
expr: >
  false
message: "insecure shortcut"
requirement: "No globally disabled certificate verification, `eval(`, `chmod 777` or wildcard CORS origin in non-test code."
rationale: "Each one was added to make something work once and removes a protection for every user afterwards."
fix:
  human: "Scope the exception to one host or one path with explicit opt-in, or remove it."
  agent: "Report each occurrence with what it disables; replace only when the secure equivalent is evident."
refs: ["https://fleetlint.org/baseline/#slop"]
