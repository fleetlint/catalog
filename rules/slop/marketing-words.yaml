id: slop/marketing-words
title: Documentation is free of marketing filler
kind: expr
severity: info
scope: root
foreach: >
  grep("**/*.md", r'\b(seamless(ly)?|blazing(ly)?[- ]fast|cutting[- ]edge|state[- ]of[- ]the[- ]art|leverag(e|es|ed|ing)|effortless(ly)?|supercharg(e|es|ed|ing)|game[- ]chang(er|ing)|world[- ]class|delv(e|es|ing)|unleash(es|ed|ing)?)\b')
expr: item.path.endsWith("CHANGELOG.md")
message: "marketing filler in documentation"
requirement: "Markdown documentation does not use marketing filler: seamless, blazing fast, cutting-edge, state-of-the-art, leverage, effortless, supercharge, game-changing, world-class, delve, unleash. Fenced code blocks and CHANGELOG.md are not read."
rationale: "Filler words are the most recognisable trace of generated prose and say nothing a reader can act on."
fix:
  human: "Rewrite the line to state the concrete behaviour; delete the adjective."
  agent: "Rewrite each flagged line without the flagged word, keeping the technical content; do not add new adjectives."
refs:
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#documentation"
