id: slop/conflict-markers
title: No merge conflict markers are committed
kind: expr
severity: error
scope: root
foreach: >
  grep("**", r'^(<{7}|>{7})( |$)')
expr: >
  false
message: "a merge conflict marker is committed"
requirement: "No file contains a merge conflict marker (`<<<<<<<` or `>>>>>>>` at the start of a line), whatever its type. Fenced code blocks in Markdown are not read."
rationale: "The file does not mean what either side intended; code usually does not compile and configuration silently changes meaning."
fix:
  human: "Resolve the conflict and remove the markers."
  agent: "Resolve the conflict using both sides' intent; ask when they contradict."
refs: ["https://fleetlint.org/baseline/#slop", "https://fleetlint.org/slop/#repository-and-files"]
