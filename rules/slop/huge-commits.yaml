id: slop/huge-commits
title: Commits are reviewable
kind: expr
severity: info
scope: root
when: repo.has_git
params:
  commits: 200
  max_lines: 1500
foreach: >
  commits(params.commits)
expr: >
  item.lines <= params.max_lines || item.root
message: "commit changes more lines than the limit"
requirement: "No commit in the recent history (`params.commits`, default 200) changes more than `params.max_lines` lines (default 1500). The root commit, usually an initial import, is exempt."
rationale: "A commit that large was not reviewed line by line, and cannot be reverted without taking unrelated changes with it."
fix:
  human: "Split work into commits of one concern each."
  agent: "Commit one concern at a time. Do not rewrite pushed history without the user's decision."
refs:
  - {url: "https://google.github.io/eng-practices/review/developer/small-cls.html", kind: style-guide}
  - {url: "https://fleetlint.org/baseline/#slop", kind: convention}
  - "https://fleetlint.org/slop/#commits-and-history"
