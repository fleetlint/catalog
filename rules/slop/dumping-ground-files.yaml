id: slop/dumping-ground-files
title: No utils or helpers dumping grounds
kind: expr
severity: info
scope: root
foreach: >
  tracked().filter(p, p.matches(r'(^|/)(utils?|helpers?|common|misc|stuff|shared_utils)\.(go|py|rs|ts|tsx|js|jsx|mjs|cjs|kt|kts|java|dart|swift|sh|rb|php|cs|fs|c|cc|cpp|h|hpp|vue|svelte|scala)$'))
expr: >
  false
message: "source file is a dumping ground by name"
requirement: "No source file is named `utils`, `helpers`, `common` or `misc`; a function lives in the module that owns its concept. Configuration, build and documentation files with these names are not read."
rationale: "A file named after nothing collects everything, and everything then depends on it."
fix:
  human: "Move each function to the module it belongs to."
  agent: "Report the file with its functions grouped by concept; move them only as a separate, behaviour-neutral change."
refs: ["https://fleetlint.org/baseline/#slop", "https://fleetlint.org/slop/#code-structure"]
