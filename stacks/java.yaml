id: java
title: Java
refs: ["https://fleetlint.org/stacks/#java"]
detect:
  - {file: pom.xml}
  # A Gradle build that applies the Java plugins and neither Kotlin nor Android.
  - {glob: build.gradle, contains: '\bjava\b|java-library|\bapplication\b', lacks: 'kotlin|android', unless_stack: flutter}
  - {glob: build.gradle.kts, contains: '\bjava\b|java-library|\bapplication\b', lacks: 'kotlin|android', unless_stack: flutter}
devcontainer: {feature: "ghcr.io/devcontainers/features/java:1", options: {installGradle: true}}
run_image: "mcr.microsoft.com/devcontainers/java:21"
lockfile_maintenance: true
