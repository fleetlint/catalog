id: kotlin
title: Kotlin / JVM
refs: ["https://fleetlint.org/stacks/#kotlin-jvm--android"]
# Every other Gradle build: Kotlin, Android, Kotlin Multiplatform. A Flutter
# app's Android shell (android/app/build.gradle.kts) is not one.
detect:
  - {glob: build.gradle.kts, unless_stack: [flutter, java]}
  - {glob: build.gradle, unless_stack: [flutter, java]}
  - {file: settings.gradle.kts, unless_stack: [flutter, java]}
  - {file: settings.gradle, unless_stack: [flutter, java]}
devcontainer: {feature: "ghcr.io/devcontainers/features/java:1", options: {installGradle: true}}
run_image: "mcr.microsoft.com/devcontainers/java:21"
lockfile_maintenance: true
