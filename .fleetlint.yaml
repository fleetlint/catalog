# .fleetlint.yaml: the catalog is checked with the rules it defines.
version: 1
extends:
  - fleetlint:recommended
facts:
  tier: 2
  visibility: public
  container: none       # data and one Go test: the gates run on the machine
scopes: []              # the templates are files for other repositories, not projects of this one
rules:
  quality/coverage-threshold:
    enabled: false
    reason: "the module is data plus one embed declaration; there is no code to cover"
