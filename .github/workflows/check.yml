# One file for GitHub and Gitea:
# Gitea Actions reads .github/workflows/ too, and both forges set github.server_url.
# Actions are pinned to commit SHAs; `pinact run -u` updates them
# (Renovate keeps the pins current via renovate.json).
name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches new vulnerabilities in unchanged code

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # diff-cover and gitleaks need history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tools, at the versions the Makefile pins
        run: make tools
      - name: Shared tools (gitleaks, diff-cover), pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          # renovate: datasource=pypi depName=diff-cover
          DIFF_COVER_VERSION: 10.6.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          pipx install "diff-cover==${DIFF_COVER_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: fleetlint (the check target runs it; pin the version you use)
        run: |
          go install github.com/fleetlint/fleetlint/cmd/fleetlint@3249f4ac50bee45b0286033498c86082a5e5d7ec   # the commit whose grammar .fleetlint.yaml uses; a tag after the next release
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check

  # The artifact a tag publishes (publish.yml), built and loaded on every
  # change: a catalog version that fleetlint cannot read fails here, not
  # after an immutable tag.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: docker.io/library/registry@sha256:21078ecfcba8a0cd7e1a384f75b3509899661dd21823bf1da21b5a4674aaceb9 # 2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: fleetlint, to load the artifact
        env:
          FLEETLINT_REF: 20bbc2881292bb3e196b60fc953f0eb06afeac94   # fleetlint artifact-instances (pre-0.8.0), which reads engine level 7
        run: |
          go install "github.com/fleetlint/fleetlint/cmd/fleetlint@${FLEETLINT_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Push to a throwaway registry and load every preset from it
        run: |
          digest=$(scripts/oci-push.sh localhost:5000/fleetlint/catalog:ci --plain-http)
          scripts/oci-check.sh "localhost:5000/fleetlint/catalog:ci@${digest}"
