# Publishes the catalog as a signed OCI artifact on every tag, so sources
# files can reference `oci://ghcr.io/fleetlint/catalog:<tag>` with
#   signers: [{issuer: https://token.actions.githubusercontent.com,
#              subject_regex: '^https://github\.com/fleetlint/catalog/\.github/workflows/publish\.yml@refs/tags/v'}]
# Actions are pinned to commit SHAs; Renovate keeps the pins current.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push presets and templates as one artifact
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Every preset becomes a root-level catalog file; templates keep their paths.
          files=()
          for p in presets/*.yaml; do cp "$p" "./$(basename "$p")"; files+=("$(basename "$p")"); done
          while IFS= read -r t; do files+=("$t"); done < <(find templates -type f | sort)
          ref="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          oras push --artifact-type application/vnd.fleetlint.catalog.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --format go-template='{{.digest}}' "$ref" "${files[@]}" > digest.txt
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"
        id: push
      - name: Sign the artifact (keyless, sigstore bundle attached as a referrer)
        run: cosign sign --yes --new-bundle-format "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.push.outputs.digest }}"
      - name: Verify what was just signed
        run: |
          cosign verify --new-bundle-format \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/\.github/workflows/publish\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.push.outputs.digest }}"
