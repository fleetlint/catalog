# Publishes this catalog version as a signed OCI artifact on every tag, and a
# GitHub release with its notes: the
# whole tree (presets/, rules/, stacks/, artifacts/, templates/, aliases.yaml), the same
# version the git tag holds, with an SBOM and build provenance attested to its digest. A repository pins it with
#   catalog: {oci: ghcr.io/fleetlint/catalog:<tag>}
# and fleetlint verifies the signature of this workflow on a version tag.
# check.yml loads the same artifact on every push to main, so a tag only
# publishes what was already tested.
# Actions are pinned to commit SHAs; Renovate keeps the pins current.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless cosign
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false   # a release build reads no cache a pull request could have written
      - name: fleetlint, to load what was published
        env:
          FLEETLINT_REF: 472ecfa8e75816684339109d2bf18b85cd304cb1   # fleetlint v0.10.0, which reads engine level 7
        run: |
          go install "github.com/fleetlint/fleetlint/cmd/fleetlint@${FLEETLINT_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Push the catalog version as one artifact
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(scripts/oci-push.sh "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the artifact (keyless, sigstore bundle attached as a referrer)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --new-bundle-format "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: SBOM of the tree, attested to the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          syft dir:. -o spdx-json > sbom.spdx.json
          cosign attest --yes --new-bundle-format --type spdxjson --predicate sbom.spdx.json \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Build provenance (SLSA), attached to the digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify what was just signed
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify --new-bundle-format \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/\.github/workflows/publish\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Load it the way a repository pins it (by tag, through the signature)
        run: scripts/oci-check.sh "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"

  # The release page: the version's CHANGELOG.md section, the engine level,
  # the digest pin and the verify commands. No assets: the signed OCI
  # artifact is the release. A job of its own, so only it can write releases.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from the CHANGELOG.md section, and the release
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > section.md
          scripts/release-notes.sh "$GITHUB_REF_NAME" "$DIGEST" section.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
