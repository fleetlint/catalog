      - name: Shared tools (gitleaks, diff-cover), pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          # renovate: datasource=pypi depName=diff-cover
          DIFF_COVER_VERSION: 10.6.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          pipx install "diff-cover==${DIFF_COVER_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: fleetlint (the check target runs it), pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=fleetlint/fleetlint
          FLEETLINT_VERSION: v0.8.1
        run: |
          set -euo pipefail
          v=${FLEETLINT_VERSION#v}
          base="https://github.com/fleetlint/fleetlint/releases/download/${FLEETLINT_VERSION}"
          curl -sSfLO "${base}/fleetlint_${v}_linux_amd64.tar.gz"
          curl -sSfL "${base}/checksums.txt" | grep " fleetlint_${v}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "fleetlint_${v}_linux_amd64.tar.gz" -C "$HOME/.local/bin" fleetlint
          rm "fleetlint_${v}_linux_amd64.tar.gz"
