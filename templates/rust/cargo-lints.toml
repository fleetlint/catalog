
# Lints the compiler and clippy enforce (see https://fleetlint.org/stacks/#rust). Appended by fleetlint fix.
# Crates in a workspace inherit these with `[lints] workspace = true`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
