# Dart analyzer configuration (see https://fleetlint.org/stacks/#flutter--dart). Written by fleetlint fix.
# Needs flutter_lints in dev_dependencies; very_good_analysis is a stricter alternative to include.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Slop guards: TODOs in one style, no prints, no unawaited or discarded futures, every return type declared.
    flutter_style_todos: true
    avoid_print: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    unawaited_futures: true
    discarded_futures: true
    use_build_context_synchronously: true
    cancel_subscriptions: true
    close_sinks: true
