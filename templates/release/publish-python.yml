
      - name: Publish to PyPI (trusted publishing, GitHub only)
        if: env.IS_GITHUB == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # On Gitea: `uv publish --publish-url <gitea>/api/packages/<owner>/pypi` with a token, if wanted.
