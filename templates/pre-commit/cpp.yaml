  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda, objective-c]
  - repo: local
    hooks:
      - id: cmake-configure
        name: cmake configure (warnings are errors)
        entry: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
        language: system
        files: (CMakeLists\.txt|\.cmake)$
        pass_filenames: false
