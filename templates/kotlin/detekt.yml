# detekt 2 configuration (see https://fleetlint.org/stacks/#kotlin-jvm--android). Written by fleetlint fix.
# Apply with the detekt 2 Gradle plugin (id "dev.detekt"): detekt { buildUponDefaultConfig = true; config.setFrom("config/detekt/detekt.yml") }.
# Only what differs from detekt's defaults is listed; `detekt --generate-config` prints everything.
# detekt 2 fails the build on any finding; there is no maxIssues any more.

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes: [InterruptedException, MalformedURLException, NumberFormatException, ParseException]
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  PrintStackTrace:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "_|(ignore|expected).*"

complexity:
  LongMethod:
    active: true
    allowedLines: 50
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
  LargeClass:
    active: true
  LongParameterList:
    active: true
    ignoreDefaultParameters: true
    ignoreAnnotated: ["Composable"]
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20

style:
  ForbiddenComment:
    active: true
    comments:
      - reason: "a TODO or FIXME needs an issue reference, e.g. TODO(#123)"
        value: "TODO:"
      - reason: "a TODO or FIXME needs an issue reference, e.g. FIXME(#123)"
        value: "FIXME:"
  UnusedPrivateFunction:
    active: true
    ignoreAnnotated: ["Preview"]
  UnusedPrivateProperty:
    active: true
    ignoreAnnotated: ["Preview"]
  UnusedParameter:
    active: true
  MagicNumber:
    active: true
    ignoreNumbers: ["-1", "0", "1", "2", "100", "1000"]
    # Compose lays out with literal dp values.
    ignoreAnnotated: ["Composable", "Preview"]
    # Every test source set: test, commonTest, androidHostTest, jvmTest, ...
    excludes: &tests ["**/test/**", "**/*Test/**"]

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase; test names are sentences in backticks.
    ignoreAnnotated: ["Composable"]
    excludes: *tests
