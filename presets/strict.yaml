apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-strict
  version: 0.1.0
  engine: 2
  description: >
    Everything in recommended, held to a higher standard: every warning is an
    error, every informational rule a warning, and the security rules take no
    exceptions. For repositories whose gate must not be argued with.
  includes: [fleetlint:recommended]

# A pattern applies first; an exact rule id refines it. Nothing is disabled.
overrides:
  "*": { raise: 1 }
  # Security rules: no per-finding exceptions either.
  hooks/secret-scan:            { exceptions: false }
  ci/actions-pinned:            { exceptions: false }
  ci/least-privilege:           { exceptions: false }
  ci/no-pull-request-target:    { exceptions: false }
  release/signing:              { exceptions: false }
  release/provenance:           { exceptions: false }
  release/checksums:            { exceptions: false }
  release/signed-tags:          { exceptions: false }
  deps/vulnerability-scan:      { exceptions: false }
  repo/lockfile-committed:      { exceptions: false }
  repo/no-tracked-env:          { exceptions: false }
  public/license:               { exceptions: false }
  public/no-agent-files:        { exceptions: false }
  public/no-ai-attribution:     { exceptions: false }
