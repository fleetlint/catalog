apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-recommended
  engine: 4
  description: >
    The default for repositories you rely on: the task-runner contract,
    hook content, lint configuration per stack, changelog and CI basics.
  includes: [fleetlint:minimal]


# Every rule of these families (rules/<family>/) is recommended; a rule added to a
# family joins the preset. public/ is listed rule by rule: its agent-file and
# AI-attribution rules belong to fleetlint:slop. The slop family is an add-on except
# for the three below and slop/conflict-markers (from fleetlint:minimal), which are
# never acceptable in a commit.
rules:
  - use: changelog/*
  - use: ci/*
  - use: containers/*
  - use: deps/*
  - use: docs/*
  - use: hooks/*
  - use: format/*
  - use: lint/*
  - use: types/*
  - use: public/license
  - use: public/manifest-license
  - use: public/security-policy
  - use: public/contributing
  - use: public/code-of-conduct
  - use: public/issue-templates
  - use: quality/*
  - use: release/*
  - use: repo/*
  - use: taskrunner/*
  - use: slop/focused-tests
  - use: slop/scratch-scripts
  - use: slop/report-documents
