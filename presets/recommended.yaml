apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-recommended
  version: 0.1.0
  engine: 2
  description: >
    The default for repositories you rely on: the task-runner contract,
    hook content, lint configuration per stack, changelog and CI basics.
  includes: [fleetlint:minimal]


# Every rule of these families (rules/<family>/) is recommended; a rule added to a
# family joins the preset. The slop family is an add-on (fleetlint:slop) except for
# the four below, which are never acceptable in a commit.
rules:
  - use: changelog/*
  - use: ci/*
  - use: containers/*
  - use: deps/*
  - use: docs/*
  - use: hooks/*
  - use: lint/*
  - use: public/*
  - use: quality/*
  - use: release/*
  - use: repo/*
  - use: taskrunner/*
  - use: slop/focused-tests
  - use: slop/conflict-markers
  - use: slop/scratch-scripts
  - use: slop/report-documents
