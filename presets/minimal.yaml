apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-minimal
  engine: 4
  description: >
    The floor for any repository, including experiments: nothing secret,
    accidental or oversized is tracked, no conflict markers are committed,
    hooks exist, and public repos have a license.


# The rules live in rules/<family>/<name>.yaml; a preset selects them.
rules:
  - use: repo/no-tracked-junk
  - use: repo/no-tracked-env
  - use: repo/no-large-files
  - use: repo/gitignore-present
  - use: hooks/config-present
  - use: hooks/secret-scan
  - use: slop/conflict-markers
  - use: public/license
