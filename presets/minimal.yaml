apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-minimal
  version: 0.1.0
  engine: 2
  description: >
    The floor for any repository, including experiments: nothing secret or
    accidental is tracked, hooks exist, and public repos carry no agent files.


# The rules live in rules/<family>/<name>.yaml; a preset selects them.
rules:
  - use: repo/no-tracked-junk
  - use: repo/no-tracked-env
  - use: repo/gitignore-present
  - use: hooks/config-present
  - use: hooks/secret-scan
  - use: public/no-agent-files
  - use: public/no-ai-attribution
