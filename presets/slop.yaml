apiVersion: fleetlint.org/v1
kind: Catalog
metadata:
  name: fleetlint-slop
  version: 0.1.0
  engine: 2
  description: >
    Heuristics for the traces careless or generated code leaves behind:
    narration comments, placeholders, swallowed errors, suppressions, skipped
    tests, vague commits. Add it next to another preset; the findings are a
    review list, not a verdict.


# Heuristics; the four slop rules in fleetlint:recommended are not repeated here.
rules:
  - use: slop/narration-comments
  - use: slop/placeholder-comments
  - use: slop/banner-comments
  - use: slop/todo-without-issue
  - use: slop/emoji-in-code
  - use: slop/typographic-chars
  - use: slop/commented-out-code
  - use: slop/debug-output
  - use: slop/arbitrary-delays
  - use: slop/variant-names
  - use: slop/variant-files
  - use: slop/swallowed-errors
  - use: slop/escape-hatches
  - use: slop/vague-errors
  - use: slop/placeholder-values
  - use: slop/insecure-patterns
  - use: slop/skipped-tests
  - use: slop/trivial-asserts
  - use: slop/emoji-headings
  - use: slop/dumping-ground-files
  - use: slop/vague-commit-messages
  - use: slop/non-conventional-commits
  - use: slop/huge-commits
