release/sbom/kotlin: [release/sbom/maven, release/sbom/android-app]
release/sbom/dotnet: [release/sbom/nuget]
release/sbom/rust: [release/sbom/crate]
release/sbom/php: [release/sbom/release-files]
release/sbom/any: [release/sbom/release-files, release/sbom/image]
release/provenance/node: [release/provenance/npm]
