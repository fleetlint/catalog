# Rule ids that were renamed. fleetlint reads an old id in overrides, exceptions
# and `use:` as the ids that replace it and prints a deprecation warning.
lint/go-config: [lint/configured/go]
lint/python-config: [lint/configured/python, types/strict/python]
lint/rust-config: [lint/configured/rust]
lint/node-config: [lint/configured/node, types/strict/node]
lint/java-config: [lint/configured/java]
lint/kotlin-config: [lint/configured/kotlin]
lint/dotnet-config: [lint/configured/dotnet]
lint/cpp-config: [lint/configured/cpp]
lint/ruby-config: [lint/configured/ruby]
lint/php-config: [lint/configured/php]
lint/flutter-config: [lint/configured/flutter]
lint/hugo-strict-build: [lint/configured/hugo]
lint/go-linters-enabled: [lint/strict/go]
lint/python-rules-enabled: [lint/strict/python]
lint/rust-lints-denied: [lint/strict/rust]
lint/kotlin-detekt-strict: [lint/strict/kotlin]
lint/node-strict-flags: [types/strict/node]
lint/flutter-strict-modes: [types/strict/flutter]
quality/no-slop-markers: [slop/marketing-words]
# 0.3: the release capabilities are implemented per published artifact, not per stack.
