id: pub
title: pub.dev package
refs: ["https://fleetlint.org/baseline/#releases", "https://dart.dev/tools/pub/automated-publishing"]
summary: "`dart pub publish` or `flutter pub publish`; in a tag-triggered workflow"
detect: >
  tagged_workflows().filter(w, steps(w).exists(s, s.run.matches("\\b(dart|flutter) pub publish\\b")))
