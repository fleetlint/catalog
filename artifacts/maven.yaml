id: maven
title: Maven artifact
refs: ["https://fleetlint.org/baseline/#releases", "https://central.sonatype.org/publish/requirements/"]
# JARs, AARs and POMs deployed to Maven Central or another Maven repository: `mvn deploy`, Gradle
# publish tasks (not publishToMavenLocal, not the Play Store's publishBundle/publishApk), JReleaser.
summary: "`mvn ... deploy`, a Gradle `publish*` task (not `publishToMavenLocal`, not the Play Store tasks), `jreleaser deploy|full-release`; in a tag-triggered workflow"
detect: >
  tagged_workflows().filter(w, steps(w).exists(s,
    s.run.matches("\\bmvn\\b[^\\n]*\\bdeploy\\b|\\bjreleaser (deploy|full-release)\\b")
    || (s.run.matches("\\bgradlew?\\b[^\\n]*\\bpublish[A-Za-z]*") && !s.run.matches("\\bpublishToMavenLocal\\b") && !s.run.matches("\\bpublish(Release|Debug)?(Bundle|Apk|Listing|Products)\\b"))))
