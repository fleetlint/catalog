id: npm
title: npm package
refs: ["https://fleetlint.org/baseline/#releases", "https://docs.npmjs.com/trusted-publishers"]
summary: "`npm|pnpm|yarn npm|bun publish`, `changeset publish`, `lerna publish`, JS-DevTools/npm-publish, changesets/action with `publish`; in any workflow not run from a pull request, whatever `if:` guards the step"
detect: >
  workflows().filter(w, (w in tagged_workflows() || triggers(w).exists(t, t in ["push", "release", "workflow_dispatch", "schedule", "create", "workflow_run", "workflow_call", "repository_dispatch"])) && (steps(w).exists(s,
    s.uses.startsWith("JS-DevTools/npm-publish")
    || (s.uses.startsWith("changesets/action") && "publish" in s.with)
    || s.run.split("\n").exists(l, l.matches("\\b(npm publish|pnpm publish|yarn npm publish|bun publish|(npx )?changeset publish|lerna publish)\\b") && !l.contains("--dry-run")))))
